<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>F2 — 淹水泵房灰盒</title>
<!-- 內嵌空圖示：擋掉瀏覽器對 /favicon.ico 的隱含請求（單檔產物不該有外部請求） -->
<link rel="icon" href="data:,">
<style>
  :root {
    --line:#232327; --dim:#6a6a70; --txt:#b8b8be; --bad:#a5675f; --ok:#7f9a78;
    /* 瀏海與 home indicator。走自訂屬性而不是直接寫 env()，
       是為了讓自動化測試能覆寫它們 —— Chromium 沒有模擬 safe-area 的能力。 */
    --sa-t: env(safe-area-inset-top, 0px);
    --sa-r: env(safe-area-inset-right, 0px);
    --sa-b: env(safe-area-inset-bottom, 0px);
    --sa-l: env(safe-area-inset-left, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { font:12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color:var(--txt);
         -webkit-user-select:none; user-select:none; touch-action:none;
         display:flex; flex-direction:column; }

  /* ── 上方 66%：第一人稱 ─────────────────────────── */
  #view { position:relative; flex:1 1 66%; min-height:0; overflow:hidden; }
  #view canvas { display:block; }
  #turnCue {
    position:absolute; left:0; right:0; bottom:6px; text-align:center;
    font-size:10px; color:#3a3a41; letter-spacing:.18em; pointer-events:none;
  }
  #dev { position:absolute; top:6px; left:8px; font-size:10px; color:#4a4a52;
         white-space:pre; pointer-events:none; display:none; }

  /* ── 下方 34%：門鎖 ─────────────────────────────── */
  #panel {
    /* 基準 34% 是「可操作區」的大小；瀏海與 home indicator 佔掉的部分另外加上去，
       否則 safe-area 會直接從撬鎖區身上扣（見 drawCutaway 的 TRAVEL 預算）。 */
    flex:0 0 calc(34% + var(--sa-b));
    background:#0e0e11; border-top:1px solid var(--line);
    padding:10px max(12px, var(--sa-r)) calc(12px + var(--sa-b)) max(12px, var(--sa-l));
    display:flex; flex-direction:column; gap:8px;
    transition:opacity .12s, filter .12s;
    /* min-height:auto 會讓面板高度變成 max(34%, min-content)，而 min-content
       又被剖面圖 canvas 的內建像素高度撐開 —— 在矮視窗（手機橫向）下 34% 會失效。 */
    min-height:0; position:relative;
  }
  #panel.blind { opacity:.12; filter:blur(3px); pointer-events:none; }
  #pins { flex:1; display:flex; gap:8px; align-items:flex-end; min-height:0; position:relative; }
  #pins.cut { display:block; }
  /* 絕對定位讓 canvas 不參與 min-content 計算，面板高度才由 flex-basis 決定 */
  #cut { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* 門 2 盤面：與剖面圖同一個位置。door2 期間 chrome 列收起，44px 還給盤面（v3 §4） */
  #circuit { position:absolute; inset:0; width:100%; height:100%; display:none; }
  #panel.door2 #circuit { display:block; }
  #panel.door2 #cut, #panel.door2 .track, #panel.door2 #chrome { display:none; }
  .track { flex:1; height:100%; position:relative; border:1px solid var(--line);
    border-radius:2px; overflow:hidden;
    background:linear-gradient(180deg,#0000 0%,#ffffff08 100%); }
  .track.sel { border-color:#c8b98f; }
  .pin { position:absolute; left:3px; right:3px; height:22px; border-radius:2px;
    transition:bottom .09s ease-out; display:grid; place-items:center;
    font-size:12px; color:#0009; }
  .flash { position:absolute; inset:0; background:var(--bad); opacity:0;
    transition:opacity .16s; pointer-events:none; }
  /* 洩壓鈕與歷程並排成一列 —— 垂直預算讓給剖面圖，因為撞針行程是
     這個面板唯一承載資訊的距離（見 drawCutaway 的 TRAVEL）。 */
  #chrome { flex:0 0 auto; display:flex; align-items:center; gap:10px; min-width:0;
    min-height:44px; }
  #seq { min-height:22px; display:flex; align-items:center; gap:6px;
    overflow:hidden; font-size:14px; color:#3c3c43; }
  .step small { font-size:9px; }
  .step.ok small { color:var(--ok); } .step.fake small { color:#c8b98f; }
  .step.err small { color:var(--bad); }
  /* 44×44 是觸控命中區的下限。洩壓是設計文件 §4 的必要機制 ——
     識破假針之後沒有它會卡死到超時，所以它不能是最難按的那個東西。 */
  #dump { flex:0 0 auto; min-height:44px; min-width:64px; padding:5px 12px;
    display:grid; place-items:center;
    border:1px solid var(--line); border-radius:3px; background:#18181b;
    color:var(--txt); font:11px ui-monospace, Menlo, monospace; }

  /* 矮視窗（手機橫向）：面板只有視窗高的 34%，把邊距壓到最低，
     否則 padding 與間距會吃掉剖面圖將近三分之一的高度。 */
  @media (max-height: 520px) {
    #panel {
      padding:4px max(8px, var(--sa-r)) calc(6px + var(--sa-b)) max(8px, var(--sa-l));
      gap:4px;
    }
  }

  /* 上方視野也讓開瀏海：3D 畫面鋪滿沒關係（暗角本來就吃掉邊緣），
     但操作提示不能被切掉。 */
  #turnCue { padding-left:var(--sa-l); padding-right:var(--sa-r); }

  /* Door 3 greybox uses the full viewport; its puzzle panel is not active yet. */
  body.door3 #view { flex:1 1 100%; }
  body.door3 #panel { display:none; }
  body.door3 #turnCue {
    bottom:10px; color:#6f8587; text-shadow:0 1px 5px #000; letter-spacing:.13em;
  }

  /* ── 黑幕 ───────────────────────────────────────── */
  /* 門 2 短路跳電：獨立於過場／死亡黑幕，避免兩套狀態互相解除。 */
  #trip { position:fixed; inset:0; background:rgba(0,5,10,.88); opacity:0; pointer-events:none;
    transition:opacity .08s linear; z-index:9; }
  #trip.on { opacity:1; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l);
    transition:opacity .18s; display:grid; place-items:center; z-index:10; }
  #fade.on { opacity:1; }
  #fade div { font-size:15px; color:#8a8a90; letter-spacing:.06em; }

  /* 中斷：切到背景或 WebGL context 遺失時蓋住畫面。
     這段期間隱藏計時器是停的 —— 玩家不該在看不見的時候被殺掉（§6 怪物必須誠實）。 */
  #halt { position:fixed; inset:0; background:#05060a; z-index:20;
    display:none; place-items:center; text-align:center;
    padding:calc(24px + var(--sa-t)) calc(24px + var(--sa-r))
            calc(24px + var(--sa-b)) calc(24px + var(--sa-l)); }
  #halt.on { display:grid; }
  #halt p { font-size:13px; color:#6a6a70; letter-spacing:.10em; line-height:2; }

  #hdbg {
    position:fixed; top:8px; left:8px; z-index:30; display:none;
    width:min(280px, calc(100vw - 16px)); max-height:calc(100vh - 16px); overflow-y:auto;
    background:rgba(10,10,12,.92); border:1px solid #2a2a2e; border-radius:4px;
    padding:8px 0 10px; color:#9a9aa0;
    font:11px/1.5 ui-monospace, Menlo, monospace; touch-action:pan-y;
  }
  #hdbg h4 { font-size:10px; letter-spacing:.12em; color:#5b5b60; padding:8px 12px 4px;
    text-transform:uppercase; }
  #hdbg .hrow { padding:2px 12px 4px; }
  #hdbg .hrow label { display:flex; justify-content:space-between; color:#9a9aa0; }
  #hdbg .hrow b { color:#d0d0d4; font-weight:400; }
  #hdbg input[type=range] { width:100%; height:14px; touch-action:auto; accent-color:#b0a48c; }
  #hdbg select, #hdbg button { width:calc(100% - 24px); margin:3px 12px; padding:6px;
    background:#17171a; color:#b8b8be; border:1px solid #2a2a2e; border-radius:3px;
    font:11px ui-monospace, Menlo, monospace; }
  #hdbg textarea { display:none; width:calc(100% - 24px); margin:6px 12px; height:120px;
    background:#0b0b0d; color:#8fa08f; border:1px solid #262629; font:10px/1.4 ui-monospace, Menlo, monospace; }

  /* Developer Debug & Transition Lab. It is opt-in via ?debug=1 and remains
     absent from the player's layout and input path otherwise. */
  #debugLab[hidden] { display:none; }
  #debugLab {
    position:fixed; top:max(8px, var(--sa-t)); right:max(8px, var(--sa-r)); z-index:40;
    width:min(326px, calc(100vw - 16px - var(--sa-l) - var(--sa-r)));
    max-height:calc(100vh - 16px - var(--sa-t) - var(--sa-b)); overflow:auto;
    background:rgba(6,9,11,.96); border:1px solid #6e4427; border-radius:5px;
    box-shadow:0 10px 32px #000b; color:#b7b5ad;
    font:11px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
    touch-action:pan-y; user-select:none;
  }
  #debugLab.collapsed { width:auto; overflow:hidden; }
  #debugLab.collapsed #dbgBody { display:none; }
  #debugLab header { position:sticky; top:0; z-index:1; display:flex; align-items:center;
    justify-content:space-between; gap:10px; padding:7px 8px;
    background:#120e0b; border-bottom:1px solid #3b291d; }
  #debugLab header strong { color:#e3a568; font-size:10px; letter-spacing:.18em; }
  #debugLab header small { flex:1; color:#725a48; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #debugLab button, #debugLab select, #debugLab input {
    min-height:34px; border:1px solid #38342f; border-radius:3px;
    background:#171716; color:#c3c0b7; font:11px ui-monospace, Menlo, monospace;
  }
  #debugLab button { padding:5px 8px; cursor:pointer; }
  #debugLab button:hover, #debugLab button.on { border-color:#aa6c3d; color:#efb77d; }
  #debugLab header button { min-height:28px; min-width:30px; padding:2px 7px; }
  #dbgBody { padding:8px; }
  #debugLab section { padding:7px 0; border-top:1px solid #24211e; }
  #debugLab section:first-child { border-top:0; padding-top:0; }
  #debugLab h4 { margin:0 0 5px; color:#756e65; font-size:9px; letter-spacing:.12em;
    font-weight:500; text-transform:uppercase; }
  #debugLab label { display:grid; grid-template-columns:86px 1fr; gap:7px;
    align-items:center; margin:4px 0; color:#88827a; }
  #debugLab select, #debugLab input[type=number] { width:100%; padding:4px 6px; min-width:0; }
  #debugLab input[type=checkbox] { min-height:auto; width:16px; height:16px; accent-color:#b66f3e; }
  #debugLab .dbgButtons { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:5px; margin-top:6px; }
  #debugLab .dbgButtons.four { grid-template-columns:repeat(4, minmax(0, 1fr)); }
  #debugLab .dbgButtons button { min-width:0; padding-left:3px; padding-right:3px; }
  #dbgStatus { display:block; min-height:66px; white-space:pre-wrap; color:#889890;
    background:#080a0a; border:1px solid #222827; border-radius:3px; padding:6px;
    user-select:text; }
  #dbgLink { margin-top:5px; color:#645f58; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; user-select:text; }
  @media (max-height:520px) {
    #debugLab { width:min(310px, calc(100vw - 16px)); font-size:10px; }
    #debugLab section { padding:5px 0; }
    #debugLab button, #debugLab select, #debugLab input { min-height:30px; }
  }
</style>
</head>
<body>

<div id="view">
  <div id="turnCue">按住畫面 = 回頭　·　放開 = 轉回門鎖</div>
  <div id="dev"></div>
</div>

<div id="panel">
  <div id="pins"></div>
  <div id="chrome">
    <button id="dump">全部洩壓</button>
    <div id="seq"></div>
  </div>
</div>

<div id="trip"></div>

<div id="fade"><div></div></div>

<div id="halt"><p></p></div>

<div id="hdbg">
  <h4>手部調整（H 開關）</h4>
  <select id="hdPose">
    <option value="run">run 奔跑</option><option value="side">side 體側</option>
    <option value="reach">reach 伸手</option>
    <option value="wrench" selected>wrench 扳手</option>
    <option value="pick">pick 撬針</option><option value="away">away 離開</option>
  </select>
  <div id="hdSliders"></div>
  <h4>Adapter 基準修正（度）</h4>
  <div id="hdAdapter"></div>
  <button id="hdExport">匯出調整結果</button>
  <textarea id="hdOut" readonly></textarea>
</div>

<aside id="debugLab" hidden aria-label="Developer Debug and Transition Lab">
  <header>
    <strong>DEBUG</strong><small id="dbgHeaderState">Transition Lab</small>
    <button id="dbgToggle" type="button" title="收合 Debug UI">−</button>
  </header>
  <div id="dbgBody">
    <section>
      <h4>Checkpoint / Transition</h4>
      <label>流程<select id="dbgSequence"></select></label>
      <label>起點<select id="dbgStage"></select></label>
      <label>Seed<input id="dbgSeed" type="number" min="0" max="2147483647" step="1"></label>
      <div class="dbgButtons">
        <button id="dbgLoad" type="button">載入起點</button>
        <button id="dbgReplay" type="button">↻ 重播</button>
      </div>
    </section>
    <section>
      <h4>Playback</h4>
      <div class="dbgButtons four">
        <button id="dbgPlay" type="button">⏸</button>
        <button class="dbgSpeed" data-speed="0.25" type="button">.25×</button>
        <button class="dbgSpeed" data-speed="0.5" type="button">.5×</button>
        <button class="dbgSpeed" data-speed="1" type="button">1×</button>
      </div>
      <div class="dbgButtons">
        <button class="dbgSpeed" data-speed="2" type="button">2×</button>
        <button id="dbgLoop" type="button">循環：關</button>
      </div>
    </section>
    <section>
      <h4>Threat Clock / Monster</h4>
      <label>凍結威脅<input id="dbgThreat" type="checkbox" checked></label>
      <label>怪物站位<select id="dbgStation">
        <option value="0">0 · 深處</option><option value="1">1 · 燈下</option>
        <option value="2">2 · 中距</option><option value="3">3 · 門前</option>
      </select></label>
      <div class="dbgButtons">
        <button id="dbgAdd10" type="button">+10 秒</button>
        <button id="dbgLast3" type="button">剩 3 秒</button>
      </div>
    </section>
    <section>
      <h4>Door 2 Shortcuts</h4>
      <div class="dbgButtons">
        <button id="dbgAnswer" type="button">套用正解</button>
        <button id="dbgWrong" type="button">保證錯誤</button>
        <button id="dbgBurnout" type="button">觸發熔斷</button>
        <button id="dbgSpare" type="button">取得備用件</button>
        <button id="dbgFatal" type="button">最終失敗</button>
        <button id="dbgCopy" type="button">複製測試網址</button>
      </div>
      <div id="dbgLink"></div>
    </section>
    <output id="dbgStatus"></output>
  </div>
</aside>

<script type="module" src="/src/main.js"></script>
</body>
</html>
