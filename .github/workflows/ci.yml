name: CI 與發布

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 建置驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型別 / 相依 / 單元測試
        run: npm run check

      - name: 建置單檔
        run: npm run build

      - name: CrazyGames 上架產物檢查
        run: npm run cg:readiness

      - name: 上傳 Pages 產物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 發布 GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 設定 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 發布
        id: deployment
        uses: actions/deploy-pages@v4
