name: CI 與發布

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 發布：快路徑 ──────────────────────────────────────────
  # 只擋在「快且穩定」的檢查後面：型別、相依分層、單元測試都是純 Node，
  # 加起來兩秒且完全確定性。整個 job 約一分鐘。
  #
  # 手機視窗測試刻意不放在這裡。那套跑真 Chromium + 軟體渲染 WebGL，
  # 三到五分鐘且對 runner 負載敏感 —— 拿它擋發布的話，每次想上線都要賭一次
  # 瀏覽器測試的穩定度，而它失敗多半不代表網站壞了。
  deploy:
    name: 建置與發布
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型別 / 相依 / 單元測試
        run: npm run check

      - name: 建置單檔
        run: npm run build

      - name: 產物大小
        run: |
          BYTES=$(stat -c%s dist/index.html)
          echo "dist/index.html = $BYTES bytes ($((BYTES/1024)) KB)"
          # 設計文件 §2：初始下載 ≤ 20MB。5MB 當早期警戒線。
          if [ "$BYTES" -gt 5242880 ]; then
            echo "::error::產物超過 5MB，離 §2 的 20MB 上限已經不遠"
            exit 1
          fi

      - name: 上傳 Pages 產物
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # enablement: true 會在 Pages 尚未啟用時自動開啟並設成 GitHub Actions 來源。
      - name: 設定 Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 發布
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

  # ── 手機視窗測試：與發布並行，不擋發布 ──────────────────────
  # 失敗代表「有東西要修」，不代表「不能上線」。網站壞掉的成本是再推一次，
  # 而擋住發布的成本是每次都要等三到五分鐘並賭測試穩定度。
  devicetest:
    name: 手機視窗測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Playwright 版本
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: 安裝 Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: 啟動靜態伺服器
        run: |
          npx http-server dist -p 8100 -s &
          npx wait-on -t 30000 http://127.0.0.1:8100/index.html

      # 幾何量測對時間不敏感，併行跑。
      - name: 幾何（版面、safe-area、命中區）
        env:
          F0_URL: http://127.0.0.1:8100/index.html
        run: |
          node tools/devicetest/devicetest.mjs > /tmp/devicetest.log 2>&1 &
          P1=$!
          node tools/devicetest/safearea.mjs   > /tmp/safearea.log   2>&1 &
          P2=$!
          FAILED=0
          for P in $P1 $P2; do wait $P || FAILED=1; done
          for L in devicetest safearea; do
            echo "══════════ $L ══════════"; cat /tmp/$L.log
          done
          exit $FAILED

      # 中斷情境量的是計時器行為，對機器負載敏感 —— 單獨跑，換一台安靜的機器。
      - name: 中斷情境（背景、context 遺失）
        if: always()
        env:
          F0_URL: http://127.0.0.1:8100/index.html
        run: node tools/devicetest/interrupt.mjs

      - name: 門 1 → 門 2 過場
        if: always()
        env:
          F0_URL: http://127.0.0.1:8100/index.html
        run: node tools/devicetest/transit.mjs

      - name: 門 3 十字泵房場景
        if: always()
        env:
          F0_URL: http://127.0.0.1:8100/index.html
        run: node tools/devicetest/door3-scene.mjs

      - name: 撞針可讀性（僅記錄）
        if: always()
        env:
          F0_URL: http://127.0.0.1:8100/index.html
        run: node tools/devicetest/pinread.mjs
