<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>F0 — 門前原型</title>
<style>
  :root { --line:#232327; --dim:#6a6a70; --txt:#b8b8be; --bad:#a5675f; --ok:#7f9a78; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { font:12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color:var(--txt);
         -webkit-user-select:none; user-select:none; touch-action:none;
         display:flex; flex-direction:column; }

  /* ── 上方 66%：第一人稱 ─────────────────────────── */
  #view { position:relative; flex:1 1 66%; min-height:0; overflow:hidden; }
  #view canvas { display:block; }
  #turnCue {
    position:absolute; left:0; right:0; bottom:6px; text-align:center;
    font-size:10px; color:#3a3a41; letter-spacing:.18em; pointer-events:none;
  }
  #dev { position:absolute; top:6px; left:8px; font-size:10px; color:#4a4a52;
         white-space:pre; pointer-events:none; display:none; }

  /* ── 下方 34%：門鎖 ─────────────────────────────── */
  #panel {
    flex:0 0 34%; background:#0e0e11; border-top:1px solid var(--line);
    padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px;
    transition:opacity .12s, filter .12s;
  }
  #panel.blind { opacity:.12; filter:blur(3px); pointer-events:none; }
  #pins { flex:1; display:flex; gap:8px; align-items:flex-end; min-height:0; position:relative; }
  #pins.cut { display:block; }
  #cut { width:100%; height:100%; display:block; }
  .track { flex:1; height:100%; position:relative; border:1px solid var(--line);
    border-radius:2px; overflow:hidden;
    background:linear-gradient(180deg,#0000 0%,#ffffff08 100%); }
  .track.sel { border-color:#c8b98f; }
  .pin { position:absolute; left:3px; right:3px; height:22px; border-radius:2px;
    transition:bottom .09s ease-out; display:grid; place-items:center;
    font-size:12px; color:#0009; }
  .flash { position:absolute; inset:0; background:var(--bad); opacity:0;
    transition:opacity .16s; pointer-events:none; }
  #seq { min-height:22px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:14px; color:#3c3c43; }
  .step small { font-size:9px; }
  .step.ok small { color:var(--ok); } .step.fake small { color:#c8b98f; }
  .step.err small { color:var(--bad); }
  #dump { align-self:flex-start; padding:5px 10px; border:1px solid var(--line);
    border-radius:3px; background:#18181b; color:var(--txt);
    font:11px ui-monospace, Menlo, monospace; }

  /* ── 黑幕 ───────────────────────────────────────── */
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    transition:opacity .18s; display:grid; place-items:center; z-index:10; }
  #fade.on { opacity:1; }
  #fade div { font-size:15px; color:#8a8a90; letter-spacing:.06em; }

  #hdbg {
    position:fixed; top:8px; left:8px; z-index:30; display:none;
    width:min(280px, calc(100vw - 16px)); max-height:calc(100vh - 16px); overflow-y:auto;
    background:rgba(10,10,12,.92); border:1px solid #2a2a2e; border-radius:4px;
    padding:8px 0 10px; color:#9a9aa0;
    font:11px/1.5 ui-monospace, Menlo, monospace; touch-action:pan-y;
  }
  #hdbg h4 { font-size:10px; letter-spacing:.12em; color:#5b5b60; padding:8px 12px 4px;
    text-transform:uppercase; }
  #hdbg .hrow { padding:2px 12px 4px; }
  #hdbg .hrow label { display:flex; justify-content:space-between; color:#9a9aa0; }
  #hdbg .hrow b { color:#d0d0d4; font-weight:400; }
  #hdbg input[type=range] { width:100%; height:14px; touch-action:auto; accent-color:#b0a48c; }
  #hdbg select, #hdbg button { width:calc(100% - 24px); margin:3px 12px; padding:6px;
    background:#17171a; color:#b8b8be; border:1px solid #2a2a2e; border-radius:3px;
    font:11px ui-monospace, Menlo, monospace; }
  #hdbg textarea { display:none; width:calc(100% - 24px); margin:6px 12px; height:120px;
    background:#0b0b0d; color:#8fa08f; border:1px solid #262629; font:10px/1.4 ui-monospace, Menlo, monospace; }
</style>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════
   CFG
   ═══════════════════════════════════════════════════════════ */
const CFG = {
  lock:   { pinCount: 4, falseCount: 1, degPerPin: 9, severeAt: 3, partialH: 0.40 },
  round:  { limit: 20, hintMs: 1000, grabMs: 1000, startDist: 26, endDist: 1.3 },
  penalty:{ severeJump: 3.5, errorSec: 0.4 },
  render: { exposure: 1.12, pixelRatio: 2.0 },
  light:  { near: { intensity: 7,  decay: 1.5, angle: 0.50 },   // 面對門：近距離不過曝
            far:  { intensity: 44, decay: 1.05, angle: 0.62 },  // 回頭：照得到油漆牆與怪物
            penumbra: 0.72, distance: 30, flicker: 0.05, fill: 1.0, ambient: 0.30 },

  vig:    { inner: 0.34, outer: 0.98 },

    width: 1.7, height: 1.05, baseY: 1.45,
    erosion: 0.34,       // 剝落程度 0~0.6
    drips: 7,            // 流掛條數
  },
  intro:  {
    runFrom: 10,         // 起跑點（門前公尺數）
    runSec: 2.2,
    // 子彈時間的四個控制點，皆為「與提示牆的有號距離」（正 = 還沒到）
    glanceEnter: 3.4,    // 開始減速
    glanceFull:  1.6,    // 進入全速慢動作
    glancePast: -0.5,    // 全速慢動作維持到牆後這裡
    glanceExit: -1.2,    // 完全恢復正常速度
    glanceSlow: 0.16,    // 子彈時間的時間倍率（越小越慢）
    glanceMaxYaw: 72,    // 轉頭角度上限（度）
    handleSec: 1.3,      // 壓門把 ×2、拉不開
    toolSec: 0.95,       // 工具插入鎖孔的演出
    bobFreq: 6.0, bobAmp: 0.05, rollAmp: 0.9,
  },
  ui:     { style: 'cutaway' },   // 'cutaway' | 'bars'（按 U 即時切換做 A/B）
  lamp:   { z: 14, y: 2.75, intensity: 2.6, color: 0x8fa3c0 },
  stations: {
    z: [22, 13.0, 6.5, 2.6], // 四個站位：走廊深處 → 燈下 → 中距 → 門前
    vis: [0, 1, 1, 0],       // 空 → 遠處剪影 → 看清楚（主場）→ 消失（然後你死）
    stareLimit: 1.4,         // 凝視超過這秒數，牠會趁燈閃的瞬間前進
    blinkSec: 0.18,          // 燈閃的長度
    // ── 潛伏：抵達最後一站後不現身，累積「空無」次數才貼臉 ──
    lurkEmptyMin: 2,         // 至少要看到幾次空走廊
    lurkEmptyMax: 3,         // 最多幾次（每局隨機）
    lurkGlanceMin: 0.30,     // 一次「回頭」要看滿幾秒才算一次空無
    lurkStareRecount: 1.1,   // 持續盯著空走廊，每隔這麼久再算一次空無
    armedStareSec: 0.9,      // 待發狀態下盯著空走廊這麼久，牠直接出現
    faceZ: 0.80,             // 貼臉時的距離（公尺）
    faceGraceSec: 1.0,       // 臉出現後的極限窗口 —— 這一秒不殺你
    faceRiseSec: 0.28,       // 「在視野裡升起」的那種出現方式，時長
    // ── 正面事件：潛伏期間，威脅也會出現在門這一側 ──
    frontMin: 1,             // 每局至少幾次正面事件
    frontMax: 2,             // 最多幾次
    frontGapSec: 2.4,        // 兩次事件之間的最小間隔
    frontDurEye: 1.15,       // 鑰匙孔眼睛的持續秒數
    frontDurRefl: 1.30,      // 積水倒影
    frontDurLever: 0.85,     // 門把被轉動
    // 各站位停留的時間比例（總和 1.0）。第一站最久 —— 空白是張力的蓄水池
    hold: [0.26, 0.16, 0.12, 0.46],   // 末段 0.46 是潛伏窗口（末站約 10.8s 抵達）
    settleMs: 260,           // 跳站的位移時間（很短，像瞬移不像走路）
  },
  seams:  { y: [1.06, 2.12], spacingZ: 1.2, depth: 0.004, width: 0.004 },
  seep: {                    // Roy 於 seep lab 調校（2026-08-05）
    color: '#5e100c',        // 平台審核打回時改深鏽色 '#3d2018'
    patches: 8,
    gloss: 0.10,             // 液珠中心的粗糙度（越低越濕亮）
    wallRough: 0.80,         // 濕痕邊緣的粗糙度 —— 兩者的落差 = 液體感
    spread: 0.34,            // 沿縫橫向暈開的半寬（滿級）
    drips: 6,                // 流掛通道數（最多 8）
    dripW: 0.055,
    runLen: 0.85,
    speed: 1.0,              // 液珠下滑速度
    bead: 1.6,
    poolAt: 0.8,             // 幾級以上出現牆腳積水（牆面上的下緣層）
    puddleAt: 0.5,           // 幾級以上地板開始積水（站位 3 起）
    puddleR: 0.62,           // 積水最大半徑（公尺）
    floodAt: 0.62,          // 幾級以上水窪連成一片
    floodCenter: 9.0,       // 水線的擴張中心（走廊 z）
    floodMax: 15.0,         // 滿級時的水線半徑（公尺）
    waterRough: 0.045,      // 水面粗糙度
    rim: 0.55,               // 液珠的亮度提升
    level: [0, 0.18, 0.55, 1.0],   // 各站位的滲透量（只在低頭時跳變）
    lampDim: [1, 0.85, 0.55, 0.30],   // 緊急照明逐站變暗
    farDim:  [1, 0.95, 0.80, 0.60],   // 回頭手電筒逐站變弱
  },
  dread: {                   // 撬鎖面板承載威脅（Iron Lung 路線）
    trackShake: [0, 0.6, 1.6, 3.2],    // 各站位的軌道顫動幅度 px
    shakeHz:    [0, 3.0, 5.5, 9.0],
    tint:       [0, 0.06, 0.16, 0.34], // 軌道滲入暗紅的程度
    kickbackAt: 2,           // 從第幾站開始，鎖芯會自己回退半格
    kickbackSec: 5.0,        // 回退間隔
    dropAt: 3,               // 從第幾站開始，未固定的針會無故落下
    dropSec: 3.4,
  },
};

const GLYPH = [
  { c:'#c05a52', s:'●' }, { c:'#5a7fc0', s:'■' }, { c:'#c9a94e', s:'▲' },
  { c:'#6a9e63', s:'◆' }, { c:'#b0763f', s:'⬟' }, { c:'#8d6ab0', s:'✚' },
];

const mulberry32 = a => () => {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

/* ═══════════════════════════════════════════════════════════
   LockState — 純邏輯（與測試台同一份，可直接抽成模組）
   ═══════════════════════════════════════════════════════════ */
class LockState {
  constructor(o = {}) {
    Object.assign(this, { pinCount: 4, falseCount: 1, degPerPin: 9, severeAt: 3,
                          rng: Math.random }, o);
    this.listeners = {};
    this.newCombination();
  }
  on(e, fn) { (this.listeners[e] ??= []).push(fn); return this; }
  emit(e, d) { for (const fn of this.listeners[e] ?? []) fn(d); }

  newCombination() {
    const n = this.pinCount, idx = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(this.rng() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    this.falsePins = new Set(idx.slice(0, this.falseCount));
    this.trueOrder = idx.slice(this.falseCount);
    this.errors = 0;
    this.clear();
  }
  clear() {
    this.pins = Array.from({ length: this.pinCount }, () => 'idle');
    this.progress = 0; this.consecutive = 0; this.solved = false;
  }
  get jammed() { return this.pins.some(s => s === 'falseSet'); }
  get cylinderDeg() { return this.progress * this.degPerPin; }
  get nextTruePin() { return this.trueOrder[this.progress] ?? -1; }

  push(i) {
    if (this.solved || this.pins[i] === 'set' || this.pins[i] === 'falseSet') return 'ignored';
    if (this.falsePins.has(i) && !this.jammed) {
      this.pins[i] = 'falseSet'; this.emit('falseSet', { pin: i }); return 'falseSet';
    }
    if (!this.jammed && i === this.nextTruePin) {
      this.pins[i] = 'set'; this.progress++; this.consecutive = 0;
      this.emit('set', { pin: i });
      if (this.progress === this.trueOrder.length) { this.solved = true; this.emit('solved', {}); }
      return 'set';
    }
    this.pins[i] = 'partial'; this.errors++; this.consecutive++;
    this.emit('error', { pin: i });
    if (this.consecutive >= this.severeAt) { this.consecutive = 0; this.emit('severe', {}); }
    return 'error';
  }
  release(i) {
    if (this.solved) return;
    if (this.pins[i] === 'set') this.progress = Math.max(0, this.progress - 1);
    const was = this.pins[i]; this.pins[i] = 'idle';
    this.emit('release', { pin: i, was });
  }
  releaseAll() {
    if (this.solved) return;
    this.pins = this.pins.map(() => 'idle'); this.progress = 0;
    this.emit('releaseAll', {});
  }
  getHint() { return { order: [...this.trueOrder], falsePins: [...this.falsePins] }; }
}

/* ═══════════════════════════════════════════════════════════
   程序化材質
   ═══════════════════════════════════════════════════════════ */
let rngTex = mulberry32(CFG.world.seed);

function makeHeightField(size, oct = 5) {
  const f = new Float32Array(size * size);
  let amp = 1, total = 0;
  for (let o = 0; o < oct; o++) {
    const cells = 2 << o, grid = new Float32Array((cells + 1) ** 2);
    for (let i = 0; i < grid.length; i++) grid[i] = rngTex();
    const sc = size / cells;
    for (let y = 0; y < size; y++) {
      const gy = y / sc, y0 = Math.floor(gy), ty = gy - y0, sy = ty * ty * (3 - 2 * ty);
      for (let x = 0; x < size; x++) {
        const gx = x / sc, x0 = Math.floor(gx), tx = gx - x0, sx = tx * tx * (3 - 2 * tx);
        const i0 = y0 * (cells + 1) + x0;
        const a = grid[i0], b = grid[i0 + 1], c = grid[i0 + cells + 1], d = grid[i0 + cells + 2];
        f[y * size + x] += amp * ((a * (1 - sx) + b * sx) * (1 - sy) + (c * (1 - sx) + d * sx) * sy);
      }
    }
    total += amp; amp *= 0.55;
  }
  for (let i = 0; i < f.length; i++) f[i] /= total;
  return f;
}
function texFrom(f, size, lo, hi) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(size, size);
  for (let i = 0; i < f.length; i++) {
    const v = (lo + f[i] * (hi - lo)) * 255 | 0;
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.NoColorSpace;
  return t;
}
function normalFrom(f, size, k) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(size, size);
  const at = (x, y) => f[((y + size) % size) * size + ((x + size) % size)];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (at(x-1,y-1)+2*at(x-1,y)+at(x-1,y+1)) - (at(x+1,y-1)+2*at(x+1,y)+at(x+1,y+1));
    const dy = (at(x-1,y-1)+2*at(x,y-1)+at(x+1,y-1)) - (at(x-1,y+1)+2*at(x,y+1)+at(x+1,y+1));
    let nx = dx*k, ny = dy*k, nz = 1; const l = Math.hypot(nx,ny,nz);
    const i = (y*size+x)*4;
    img.data[i] = (nx/l*.5+.5)*255; img.data[i+1] = (ny/l*.5+.5)*255;
    img.data[i+2] = (nz/l*.5+.5)*255; img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.NoColorSpace;
  return t;
}

const S = 256, field = makeHeightField(S);
const tMap = texFrom(field, S, 0.72, 1.0),
      tRgh = texFrom(field, S, 0.62, 0.98),
      tNrm = normalFrom(field, S, 2.2);

function concrete(tint, rx, ry) {
  const m = tMap.clone(), r = tRgh.clone(), n = tNrm.clone();
  for (const t of [m, r, n]) { t.repeat.set(rx, ry); t.needsUpdate = true; }
  return new THREE.MeshStandardMaterial({
    color: tint, map: m, roughnessMap: r, normalMap: n,
    normalScale: new THREE.Vector2(0.8, 0.8), roughness: 1, metalness: 0,
  });
}
const matWall = concrete(0x8e9095, 2, 2.4);
const matFloor = concrete(0x6a6c70, 2, 3);
const matCeil = concrete(0x76787c, 2, 3);
const matDoor = concrete(0x55585d, 1, 1.4);
const matMetal = new THREE.MeshStandardMaterial({ color: 0x4e5257, roughness: .5, metalness: .45 });
const matDark = new THREE.MeshBasicMaterial({ color: 0x000000 });

/* ═══════════════════════════════════════════════════════════
   場景
   ═══════════════════════════════════════════════════════════ */
const view = document.getElementById('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(CFG.fog.color, CFG.fog.density);

const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 60);
camera.position.set(0, 1.62, 0);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: devicePixelRatio < 2 });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CFG.render.exposure;
renderer.setPixelRatio(Math.min(devicePixelRatio, CFG.render.pixelRatio));
view.appendChild(renderer.domElement);

const planeGeo = new THREE.PlaneGeometry(1, 1);
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 16);

/* ── 走廊：玩家站在門前，走廊往身後延伸 ─────────────── */
const { corridorW: W, corridorH: H, segLen: L, segCount: N } = CFG.world;
for (let i = 0; i < N; i++) {
  const g = new THREE.Group();
  g.position.z = i * L;
  const fl = new THREE.Mesh(planeGeo, matFloor);
  fl.rotation.x = -Math.PI / 2; fl.scale.set(W, L, 1); g.add(fl);
  const ce = new THREE.Mesh(planeGeo, matCeil);
  ce.rotation.x = Math.PI / 2; ce.position.y = H; ce.scale.set(W, L, 1); g.add(ce);
  for (const side of [-1, 1]) {
    const wl = new THREE.Mesh(planeGeo, matWall);
    wl.rotation.y = -side * Math.PI / 2;
    wl.position.set(side * W / 2, H / 2, 0);

  digi: 0.75,          // 反關節後腿（0 = 人腿，1 = 趾行足）

  eyeBlack: 1.0,       // 全黑無眼白（1 = 全黑濕眼，0 = 用反光眼）
  eyeWide: 0.0,        // 眼睛往兩側移（獵物的眼位長在掠食者臉上）
  noseSlit: 0.8,       // 無鼻，只有兩道鼻裂
  teeth: 0.35,         // 牙齒（過多、均一）—— PEGI 邊緣，克制使用
  // 皮膚
  skinBright: 0.72,    // 蒼白程度（0 黑 – 1 白）
  rough: 0.92,
  noiseAmp: 0.55,      // 皮膚噪聲（法線強度）
  // 眼睛

  eyeSize: 0.015,

let skinMat, socketMat, shineMat, blackEyeMat, toothMat;
function buildMaterials() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const c = cv.getContext('2d');
  const img = c.createImageData(128, 128);
  const r = mulberry32(991);

    img.data[i+1] = 128 + (r() - 0.5) * a;
    img.data[i+2] = 255;
    img.data[i+3] = 255;

  c.putImageData(img, 0, 0);
  const nrm = new THREE.CanvasTexture(cv);
  nrm.wrapS = nrm.wrapT = THREE.RepeatWrapping;

/* ═══════════════════════════════════════════════════════════
   怪物：連續表面的錯誤人形
   關鍵：不拼接基本體。沿脊椎生成環狀網格，半徑曲線帶凹陷
   （腰、鎖骨、眼窩），靠假 AO 頂點色把凹處壓暗 —— 凹面
   才有恐怖，凸面只有可愛。
   ═══════════════════════════════════════════════════════════ */
let torsoRef = null, headRef = null;
const SIDES = 12;

/* 由一串環（中心、橢圓半徑、頂點暗度）生成連續管狀網格 */
function tubeGeometry(rings, capTop, capBot) {
  const pos = [], col = [], idx = [];
  for (const r of rings) {
    for (let j = 0; j < SIDES; j++) {
      const a = (j / SIDES) * Math.PI * 2;
      const x = Math.cos(a) * r.rx, z = Math.sin(a) * r.rz;
      // 環可繞 x 軸傾斜（脊椎彎曲）
      const ca = Math.cos(r.tilt || 0), sa = Math.sin(r.tilt || 0);
      pos.push(r.c.x + x, r.c.y + z * sa, r.c.z + z * ca);
      // 側面比正面暗一點：假 AO 的第一層
      const side = 0.82 + 0.18 * Math.abs(Math.cos(a));
      const d = (r.ao ?? 1) * side;
      col.push(d, d, d);
    }
  }
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < SIDES; j++) {
      const a = i * SIDES + j, b = i * SIDES + (j + 1) % SIDES;
      const c = a + SIDES, d = b + SIDES;
      idx.push(a, c, b, b, c, d);
    }
  }
  const capRing = (ringIdx, up) => {
    const r = rings[ringIdx];
    const ci = pos.length / 3;
    pos.push(r.c.x, r.c.y + (up ? r.rx * 0.5 : -r.rx * 0.5), r.c.z);
    const d = (r.ao ?? 1) * 0.8;
    col.push(d, d, d);
    for (let j = 0; j < SIDES; j++) {
      const a = ringIdx * SIDES + j, b = ringIdx * SIDES + (j + 1) % SIDES;
      if (up) idx.push(a, ci, b); else idx.push(b, ci, a);
    }
  };
  if (capTop) capRing(rings.length - 1, true);
  if (capBot) capRing(0, false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* 沿一條路徑生成錐狀肢體 */
function limbRings(from, to, r0, r1, bend, bendAxis) {
  const rings = [], N = 7;
  const dir = to.clone().sub(from);
  const len = dir.length();
  const perp = (bendAxis || new THREE.Vector3(0, 0, 1)).clone().normalize();
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const c = from.clone().lerp(to, t);
    c.addScaledVector(perp, Math.sin(t * Math.PI) * bend * len);
    const rr = r0 + (r1 - r0) * t;
    rings.push({ c, rx: rr, rz: rr * 0.86, ao: 0.78 + 0.22 * (1 - Math.abs(0.5 - t) * 2) });
  }
  return rings;
}

function buildMonsterMesh() {
  buildMaterials();
  const g = new THREE.Group();
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const mesh = geo => new THREE.Mesh(geo, skinMat);

  const legTop = MP.legLen;
  const torsoLen = MP.height - MP.legLen - MP.neckH - MP.headH;
  const gz = 1 - MP.gaunt * 0.42;             // 消瘦 → 體側更扁
  const asymL = 1 + MP.asym * 0.08, asymR = 1 - MP.asym * 0.05;

  /* ── 軀幹：半徑曲線帶腰凹與鎖骨窪 ── */
  const prof = [
    // t,     rx 比例, rz 比例, ao
    [0.00, 1.02, 0.86, 0.72],   // 骨盆
    [0.16, 0.86, 0.68, 0.62],   // 腰（凹）
    [0.30, 0.80, 0.60, 0.58],   // 最細處
    [0.50, 0.96, 0.70, 0.78],   // 下胸
    [0.68, 1.06, 0.74, 0.88],   // 上胸（肋骨）
    [0.82, 1.02, 0.66, 0.70],   // 鎖骨下的凹
    [0.92, 1.18, 0.60, 0.95],   // 肩線（寬而扁）
    [1.00, 0.42, 0.40, 0.55],   // 頸根（急縮）
  ];
  const baseRX = MP.shoulderW * 0.42;
  const hunchRad = THREE.MathUtils.degToRad(MP.hunch);
  const torso = new THREE.Group();
  torso.position.y = legTop;
  g.add(torso);
  torsoRef = torso;
  {
    const rings = prof.map(([t, fx, fz, ao]) => {
      const bend = Math.pow(t, 1.7) * hunchRad;               // 上半身前傾
      const lean = Math.sin(t * Math.PI) * MP.asym * 0.035;    // 脊椎側彎
      const gaunt = 1 - MP.gaunt * 0.20 * (1 - Math.abs(0.5 - t) * 1.4);
      return {
        c: V(lean, t * torsoLen, -Math.sin(bend) * torsoLen * 0.30),
        rx: baseRX * fx * gaunt,
        rz: baseRX * fz * gz * gaunt,
        tilt: bend,
        ao: ao,
      };
    });
    torso.add(mesh(tubeGeometry(rings, true, true)));
    torso.userData.rings = rings;
  }
  const shoulderRing = torso.userData.rings[6];
  const neckRing = torso.userData.rings[7];

  /* ── 手臂：過長、錐狀、肘部彎曲，左右不等長 ── */
  for (const s of [-1, 1]) {
    const armLen = MP.armLen * (s < 0 ? asymL : asymR);
    const shY = shoulderRing.c.y + (s < 0 ? MP.asym * 0.03 : 0);   // 肩高差
    const sh = V(s * MP.shoulderW / 2, shY, shoulderRing.c.z);
    const elbow = V(s * (MP.shoulderW / 2 + 0.035), shY - armLen * 0.47, shoulderRing.c.z + 0.03);
    const wrist = V(s * (MP.shoulderW / 2 + 0.02), shY - armLen * 0.94, shoulderRing.c.z - 0.02);
    torso.add(mesh(tubeGeometry(
      limbRings(sh, elbow, MP.armThick, MP.armThick * 0.80, 0.06, V(0, 0, 1)), true, false)));
    torso.add(mesh(tubeGeometry(
      limbRings(elbow, wrist, MP.armThick * 0.80, MP.armThick * 0.52, -0.05, V(0, 0, 1)), false, false)));
    // 手掌：扁平
    const palmTop = wrist.clone();
    const palmBot = wrist.clone().add(V(0, -0.075, 0));
    const palm = limbRings(palmTop, palmBot, MP.armThick * 0.55, MP.armThick * 0.62, 0, V(0, 0, 1));
    for (const r of palm) { r.rz *= 0.45; r.rx *= 1.15; }
    torso.add(mesh(tubeGeometry(palm, false, false)));
    // 手指：過長、不等長、微張
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * MP.armThick * 0.52;
      const fl = MP.fingerLen * (1 - Math.abs(f - 1.5) * 0.10);
      const a = palmBot.clone().add(V(fx, 0, 0));
      const b = a.clone().add(V(fx * 0.5, -fl, 0.012));
      torso.add(mesh(tubeGeometry(
        limbRings(a, b, MP.armThick * 0.20, MP.armThick * 0.11, 0.04, V(0, 0, 1)), true, false)));
    }
  }

  /* ── 脖子 ── */
  {
    const a = V(neckRing.c.x, neckRing.c.y, neckRing.c.z);
    const b = V(neckRing.c.x, neckRing.c.y + MP.neckH, neckRing.c.z - Math.sin(hunchRad) * MP.neckH * 0.5);
    const rings = limbRings(a, b, baseRX * 0.40, baseRX * 0.34, 0, V(0, 0, 1));
    for (const r of rings) r.ao = 0.55;
    torso.add(mesh(tubeGeometry(rings, false, false)));
    torso.userData.headAt = b;
  }

  /* ── 頭：變形球體，挖眼窩、收下顎、開口 ── */
  const head = new THREE.Group();
  const hp = torso.userData.headAt;
  head.position.set(hp.x, hp.y + MP.headH * 0.42, hp.z);
  head.rotation.z = THREE.MathUtils.degToRad(MP.headTilt);
  head.rotation.y = THREE.MathUtils.degToRad(MP.headYaw);
  torso.add(head);
  headRef = head;
  {
    const geo = new THREE.SphereGeometry(1, 20, 16);
    const pos = geo.attributes.position;
    const cols = [];
    const gap = MP.headW * (MP.eyeGap + MP.eyeWide * 0.35);
    const socketR = MP.eyeSize * 2.4 * MP.socketScale;
    for (let i = 0; i < pos.count; i++) {
      let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      x *= MP.headW; y *= MP.headH; z *= MP.headW * 0.90;
      // 上顎往前突出（獸吻）：下半臉沿 -z 拉出
      if (MP.muzzle > 0.01) {
        const lowerF = Math.max(0, -y / MP.headH);
        const front = Math.max(0, -z) / (MP.headW * 0.9);
        z -= lowerF * front * MP.muzzle * MP.headH * 0.62;
        y -= lowerF * front * MP.muzzle * MP.headH * 0.10;
      }
      // 下顎收窄 + 後腦扁平
      const lower = Math.max(0, -y / MP.headH);
      const narrow = 1 - lower * (0.30 + MP.jawDrop * 0.10);
      x *= narrow; z *= narrow;
      if (z > 0) z *= 0.86;                       // 後腦壓扁
      let dark = 1;
      // 挖眼窩：靠近窩心的頂點往內推，並壓暗
      for (const s of [-1, 1]) {
        const d = Math.hypot(x - s * gap, y - MP.eyeHeight, z + MP.headW * 0.86);
        const f = Math.max(0, 1 - d / (socketR * 2.0));
        if (f > 0) {
          const push = f * f * socketR * 1.5;
          const n = 1 / Math.max(1e-4, Math.hypot(x, y, z));
          x -= x * n * push; y -= y * n * push; z -= z * n * push;
          dark = Math.min(dark, 1 - f * 0.92);
        }
      }
      // 顴骨下的凹陷
      for (const s of [-1, 1]) {
        const d = Math.hypot(x - s * MP.headW * 0.72, y + MP.headH * 0.16, z + MP.headW * 0.55);
        const f = Math.max(0, 1 - d / (MP.headW * 0.55));
        if (f > 0) { const n = 1 / Math.max(1e-4, Math.hypot(x, y, z));
          const push = f * f * MP.headW * 0.20;
          x -= x * n * push; y -= y * n * push; z -= z * n * push;
          dark = Math.min(dark, 1 - f * 0.35); }
      }
      // 鼻：不存在。只有兩道朝下的裂縫 —— 頭骨的特徵，極便宜極有效
      if (MP.noseSlit > 0.01) {
        for (const sn of [-1, 1]) {
          const nx = (x - sn * MP.headW * 0.11) / (MP.headW * 0.075);
          const ny = (y - MP.headH * (0.02 - MP.muzzle * 0.06)) / (MP.headH * 0.085);
          const nz = Math.max(0, -z) / (MP.headW * 0.9);
          const f = Math.max(0, 1 - Math.hypot(nx, ny)) * nz;
          if (f > 0) {
            const n = 1 / Math.max(1e-4, Math.hypot(x, y, z));
            const push = f * MP.headH * 0.085 * MP.noseSlit;
            x -= x * n * push; y -= y * n * push; z -= z * n * push;
            dark = Math.min(dark, 1 - f * 0.90 * MP.noseSlit);
          }
        }
      }
      // 嘴：下半臉的橫向暗溝，微微內凹
      {
        const mx = Math.abs(x) / (MP.headW * 0.42), my = (y + MP.headH * 0.40) / (MP.headH * 0.13);
        const f = Math.max(0, 1 - Math.hypot(mx, my));
        if (f > 0) {
          const n = 1 / Math.max(1e-4, Math.hypot(x, y, z));
          const push = f * MP.headH * 0.10 * (0.4 + MP.jawDrop);
          x -= x * n * push; y -= y * n * push; z -= z * n * push;
          dark = Math.min(dark, 1 - f * 0.88);
        }
      }
      pos.setXYZ(i, x, y, z);
      cols.push(dark, dark, dark);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    geo.computeVertexNormals();
    head.add(new THREE.Mesh(geo, skinMat));
    // 眼球：全黑濕眼（無眼白 → 讀不出視線）或反光眼
    for (const s of [-1, 1]) {
      const useBlack = MP.eyeBlack > 0.5;
      const r = MP.eyeSize * (useBlack ? 1.55 : 1);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8),
        useBlack ? blackEyeMat : shineMat);
      eye.position.set(s * gap, MP.eyeHeight, -MP.headW * 0.86 + socketR * 0.55);
      head.add(eye);
      // 遠距離看不到黑眼 —— 補一顆極小的反光點維持剪影上的可讀性
      if (useBlack && MP.eyeShine > 0.01) {
        const spark = new THREE.Mesh(new THREE.SphereGeometry(MP.eyeSize * 0.30, 6, 5), shineMat);
        spark.position.set(s * gap - 0.004, MP.eyeHeight + 0.004, -MP.headW * 0.86 + socketR * 0.55 - r * 0.75);
        head.add(spark);
      }
    }
    // 牙：均一的一排（人的牙有分工，均一 = 錯的物種）
    if (MP.teeth > 0.05 && MP.jawDrop > 0.15) {
      const n = Math.round(6 + MP.teeth * 8);
      const mw = MP.headW * 0.42 * (1 - MP.muzzle * 0.15);
      const my = -MP.headH * (0.40 - MP.muzzle * 0.05);
      const mz = -MP.headW * 0.70 - MP.muzzle * MP.headH * 0.42;
      for (let i = 0; i < n; i++) {
        const u = (i / (n - 1) - 0.5) * 2;
        const t = new THREE.Mesh(new THREE.ConeGeometry(0.0042, 0.014 * (0.7 + MP.teeth), 5), toothMat);
        t.position.set(u * mw, my + MP.headH * 0.035, mz + Math.abs(u) * MP.headW * 0.10);
        t.rotation.x = Math.PI;
        head.add(t);
        const b = t.clone();
        b.position.y = my - MP.headH * 0.045 * (0.5 + MP.jawDrop);
        b.rotation.x = 0;
        head.add(b);
      }
    }
  }

  /* ── 腿：digi 參數在「人腿」與「趾行反關節」之間插值 ──
     人：髖 → 膝(前) → 踝(地)
     獸：髖 → 膝(前) → 跗關節(後上方) → 蹠骨 → 趾著地
     剪影上這是最大的一個差異 —— 一眼就「不是人」，但整體還是人形。 */
  for (const s of [-1, 1]) {
    const shift = s * MP.stance / 2 + MP.asym * 0.02;
    const d = MP.digi;
    const hip = V(shift, legTop, 0);
    // 膝：digi 越高越往前、越高
    const knee = V(shift + s * 0.012, legTop * (0.48 + d * 0.10), 0.02 + d * 0.10
                   + (s < 0 ? MP.asym * 0.02 : 0));
    // 跗關節：往後翹起（反關節的視覺核心）
    const hock = V(shift + s * 0.016, legTop * (0.20 + d * 0.10), 0.02 - d * 0.16);
    // 蹠骨末端 → 趾著地：digi 高時腳跟離地
    const toe  = V(shift + s * 0.02, 0.03, -0.01 + d * 0.09);
    g.add(mesh(tubeGeometry(limbRings(hip, knee, 0.062, 0.044, 0.05, V(0, 0, 1)), false, false)));
    g.add(mesh(tubeGeometry(limbRings(knee, hock, 0.044, 0.030, -0.03, V(0, 0, 1)), false, false)));
    g.add(mesh(tubeGeometry(limbRings(hock, toe, 0.030, 0.022, 0.02 * (1 - d), V(0, 0, 1)), false, true)));
    if (d > 0.25) {   // 趾：著地的那一小段
      const tip = toe.clone().add(V(0, -0.015, -0.055 * d));
      g.add(mesh(tubeGeometry(limbRings(toe, tip, 0.022, 0.016, 0, V(0, 0, 1)), false, true)));
    }
  }

  return g;
}

/* 走廊劣化 rig：每過一站，回頭看到的走廊更不對勁（PEGI 12：
   刮痕、傾倒、失靈與污漬，不用血腥）。變化只在玩家低頭時發生。 */
const decay = { applied: 0 };
const decayGroup = new THREE.Group();
scene.add(decayGroup);
const decayStages = [];
{
  // 程序化刮痕貼片
  function scratchTex() {
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const c = cv.getContext('2d');
    for (let i = 0; i < 26; i++) {
      c.strokeStyle = `rgba(12,10,9,${.25 + Math.random() * .5})`;
      c.lineWidth = .8 + Math.random() * 2.2;
      const y = Math.random() * 128, dy = (Math.random() - .5) * 30;
      c.beginPath(); c.moveTo(-8, y); c.lineTo(136, y + dy); c.stroke();
    }
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  const scratchMat = new THREE.MeshBasicMaterial({
    map: scratchTex(), transparent: true, opacity: 0.85, depthWrite: false,
  });
  const mkScratch = (x, y, z, w, h, ry) => {
    const m = new THREE.Mesh(planeGeo, scratchMat);
    m.scale.set(w, h, 1); m.position.set(x, y, z); m.rotation.y = ry;
    m.visible = false; decayGroup.add(m); return m;
  };
  // 遠處的第二盞燈（會死掉）
  const farTube = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: 0x93a4bd }));
  farTube.scale.set(0.34, 0.03, 0.12); farTube.position.set(0, 2.82, 19.5);
  scene.add(farTube);
  const farLight = new THREE.PointLight(0x8fa3c0, 1.0, 12, 1.4);
  farLight.position.set(0, 2.7, 19.5); scene.add(farLight);
  // 提示牆上的深色抹痕（部分遮掩，不蓋掉序列）
  const smear = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({
    color: 0x241a15, transparent: true, opacity: 0.55, depthWrite: false }));
  smear.scale.set(0.7, 0.5, 1);
  smear.rotation.y = Math.PI / 2;
  smear.position.set(-CFG.world.corridorW / 2 + 0.015, CFG.paint.baseY - 0.28, CFG.paint.wallZ + 0.5);
  smear.visible = false; decayGroup.add(smear);

  const s1 = mkScratch(-CFG.world.corridorW/2 + 0.01, 1.4, 9, 1.3, 0.9, Math.PI/2);
  const s2 = mkScratch( CFG.world.corridorW/2 - 0.01, 1.1, 7, 1.6, 1.1, -Math.PI/2);
  const s3 = mkScratch( CFG.world.corridorW/2 - 0.01, 1.5, 3.4, 1.2, 1.4, -Math.PI/2);

  // 每站的劣化內容（apply 只會被呼叫一次）
  decayStages.push(
    () => { farLight.intensity = 0.12; farTube.material.color.setScalar(0.10); },  // 站1→2 前奏：遠燈死
    () => { s1.visible = s2.visible = true; smear.visible = true; },               // 抹痕與刮痕出現
    () => { s3.visible = true; scene.fog.density = 0.062;                          // 深刮痕、霧變濃
            for (const d of scene.children) if (d.userData?.debris) d.rotation.z = 0.4; },
  );
  decayGroup.userData = { farLight, farTube };
}

/* 滲透 rig：程序化流體著色器（seep lab 移植）
   濕痕是靜的（既成事實），液珠是動的（還在流）。
   量只在玩家低頭時跳變；運動持續進行。
   注入 MeshStandardMaterial，所以吃手電筒的光 ——
   逐片段改寫 roughness 造成的高光落差，才是「液體」的讀法。 */
const seepPatches = [];
const seepUni = {
  uTime:      { value: 0 },
  uLevel:     { value: 0 },
  uColor:     { value: new THREE.Color(CFG.seep.color) },
  uSpread:    { value: CFG.seep.spread },
  uDrips:     { value: CFG.seep.drips },
  uDripW:     { value: CFG.seep.dripW },
  uRunLen:    { value: CFG.seep.runLen },
  uSpeed:     { value: CFG.seep.speed },
  uBead:      { value: CFG.seep.bead },
  uPoolAt:    { value: CFG.seep.poolAt },
  uRim:       { value: CFG.seep.rim },
  uGloss:     { value: CFG.seep.gloss },
  uWallRough: { value: CFG.seep.wallRough },
  uPuddleAt: { value: CFG.seep.puddleAt },

  uFloodC:    { value: CFG.seep.floodCenter },

  uWaterRough:{ value: CFG.seep.waterRough },
  uSeepPos:   { value: Array.from({length:8}, () => new THREE.Vector2()) },
  uSeepCount: { value: 0 },
  uZ0:        { value: -2.0 },
  uZLen:      { value: 26.0 },
  uCorrW:     { value: CFG.world.corridorW },
};

const SEEP_COMMON = `
uniform float uTime, uLevel, uSpread, uDrips, uDripW, uRunLen;
uniform float uSpeed, uBead, uPoolAt, uRim, uGloss, uWallRough, uSeed;
uniform float uPuddleAt, uPuddleR, uFloodAt, uFloodC, uFloodMax, uWaterRough;
uniform float uSeepCount, uZ0, uZLen, uCorrW;
uniform vec2 uSeepPos[8];
uniform vec3 uColor;
float sHash(float n){ return fract(sin(n * 127.1 + uSeed) * 43758.5453); }
`;

const SEEP_BODY = `
  float seamV = 0.93;
  float dx = vUv.x - 0.5;
  float spread = 0.06 + uLevel * uSpread;

  float bandH = 0.018 + uLevel * 0.030;
  float band = smoothstep(seamV - bandH, seamV - bandH * 0.45, vUv.y)
             * (1.0 - smoothstep(seamV, seamV + 0.012, vUv.y))
             * smoothstep(spread, spread * 0.32, abs(dx));

  float trail = 0.0, bead = 0.0;
  for (int i = 0; i < 8; i++) {
    float fi = float(i);
    if (fi >= uDrips) break;
    float cx  = (sHash(fi * 3.13) - 0.5) * 1.85 * spread;
    float w   = uDripW * (0.45 + sHash(fi * 7.71)) * (0.45 + uLevel * 0.8);
    float ln  = uRunLen * (0.30 + sHash(fi * 5.31) * 0.85) * (0.28 + uLevel * 0.95);
    float sp  = (0.055 + sHash(fi * 11.3) * 0.075) * uSpeed;
    float ph  = sHash(fi * 17.9);
    float d   = abs(dx - cx);
    float colM = smoothstep(w, w * 0.30, d);

    float t = smoothstep(seamV - ln, seamV - ln * 0.88, vUv.y)
            * (1.0 - smoothstep(seamV, seamV + 0.006, vUv.y));
    trail = max(trail, colM * t * 0.82);

    float cyc  = fract(uTime * sp + ph);
    float head = seamV - cyc * cyc * ln;
    float ndx  = d / max(1e-4, w * uBead);
    float ndy  = (vUv.y - head) / max(1e-4, w * uBead * 2.3);
    float b    = 1.0 - smoothstep(0.45, 1.0, sqrt(ndx * ndx + ndy * ndy));
    b *= smoothstep(0.0, 0.12, cyc) * (1.0 - smoothstep(0.86, 1.0, cyc));
    bead = max(bead, b);
  }

  float pool = 0.0;
  if (uLevel > uPoolAt) {
    float ripple = 0.006 * sin(vUv.x * 34.0 + uTime * 1.1);
    pool = (1.0 - smoothstep(0.03, 0.085 + ripple, vUv.y))
         * smoothstep(spread * 1.4, spread * 0.5, abs(dx));
  }

  float cover = clamp(max(max(band, trail), max(bead, pool)), 0.0, 1.0);
  cover *= step(0.001, uLevel);
`;

function makeSeepMaterial(seed) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, transparent: true, roughness: CFG.seep.gloss, metalness: 0.04,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2,
  });
  mat.defines = { USE_UV: '' };
  mat.customProgramCacheKey = () => 'seep';
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, seepUni, { uSeed: { value: seed } });
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + SEEP_COMMON)
      .replace('#include <map_fragment>', SEEP_BODY + `
        diffuseColor.rgb = uColor * (0.72 + uRim * bead + 0.18 * pool);
        diffuseColor.a  *= cover;
        if (diffuseColor.a < 0.004) discard;
      `)
      .replace('#include <roughnessmap_fragment>', `
        float roughnessFactor = mix(uWallRough, uGloss, max(bead, max(band, pool)));
      `);
  };
  return mat;
}

const WATER_BODY = `
  // 貼片 UV → 走廊世界座標
  float wx = (vUv.x - 0.5) * uCorrW;
  float wz = uZ0 + vUv.y * uZLen;

  float lvl = smoothstep(uPuddleAt, 1.0, uLevel);

  // 1. 滲透點下方的水窪：隨等級擴大
  float f = 0.0;
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uSeepCount) break;
    vec2 sp = uSeepPos[i];
    vec2 d = vec2(wx - sp.x, wz - sp.y);
    d.x *= 0.85;
    float r = uPuddleR * (0.55 + 2.6 * lvl);
    f = max(f, 1.0 - smoothstep(r * 0.55, r, length(d)));
  }

  // 2. 水線：水窪連成一片後，從中段往兩頭推進
  float flood = smoothstep(uFloodAt, 1.0, uLevel);
  float radius = uFloodMax * flood;
  float wobble = 0.45 * sin(wx * 1.7 + 2.1) + 0.30 * sin(wz * 0.9)
               + 0.18 * sin(wz * 2.6 + wx * 3.1);
  float sheet = 1.0 - smoothstep(radius - 0.9, radius + wobble, abs(wz - uFloodC));
  f = max(f, sheet * step(0.001, flood));

  // 3. 靠牆處水較深（水是從牆上流下來的）
  float toWall = 1.0 - smoothstep(0.0, uCorrW * 0.42, abs(abs(wx) - uCorrW * 0.5));
  f = min(1.0, f * (0.82 + 0.35 * toWall));

  // 4. 液滴落點的漣漪
  float ring = 0.0;
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uSeepCount) break;
    vec2 sp = uSeepPos[i];
    float dd = length(vec2(wx - sp.x, wz - sp.y));
    float rspd = 0.30 + sHash(float(i) * 9.13) * 0.28;
    float cyc = fract(uTime * rspd + sHash(float(i) * 4.71));
    float rr = cyc * (0.55 + 1.4 * lvl);
    ring += (1.0 - smoothstep(0.0, 0.045, abs(dd - rr))) * (1.0 - cyc) * step(0.06, cyc);
  }

  float cover = clamp(f, 0.0, 1.0);
  float rim = smoothstep(0.42, 0.62, cover) * (1.0 - smoothstep(0.62, 0.86, cover));
`;

function makeWaterMaterial() {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, transparent: true, roughness: CFG.seep.waterRough, metalness: 0.10,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3,
  });
  mat.defines = { USE_UV: '' };
  mat.customProgramCacheKey = () => 'water';
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, seepUni, { uSeed: { value: 3.7 } });
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + SEEP_COMMON)
      .replace('#include <map_fragment>', WATER_BODY + `
        diffuseColor.rgb = uColor * (0.42 + 0.34 * ring + 0.30 * rim);
        diffuseColor.a  *= smoothstep(0.06, 0.34, cover) * 0.93;
        if (diffuseColor.a < 0.004) discard;
      `)
      .replace('#include <roughnessmap_fragment>', `
        float roughnessFactor = mix(uWallRough * 0.7, uWaterRough, smoothstep(0.15, 0.6, cover));
      `);
  };
  return mat;
}



/* 積水裡的倒影：門前地面一小片，映出一個身後其實不存在的人形。
   用同一套「錯誤的人形」剪影，垂直翻轉 + 水面擾動。 */
const reflection = (() => {
  const cv = document.createElement('canvas'); cv.width = 96; cv.height = 160;
  const c = cv.getContext('2d');
  const blob = (x, y, rx, ry, a) => {
    c.save(); c.translate(x, y); c.scale(rx / ry, 1); c.translate(-x, -y);
    c.fillStyle = `rgba(6,6,8,${a})`;
    c.beginPath(); c.arc(x, y, ry, 0, 6.283); c.fill(); c.restore();
  };
  // 倒立的人形：頭在下方（水面在腳邊）
  blob(48, 138, 12, 14, 0.95);          // 頭
  blob(48, 92, 20, 38, 0.95);           // 軀幹
  blob(30, 96, 7, 34, 0.85);            // 過長的左臂
  blob(66, 96, 7, 34, 0.85);            // 過長的右臂
  blob(41, 34, 8, 30, 0.8);             // 腿
  blob(55, 34, 8, 30, 0.8);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 });
  const m = new THREE.Mesh(planeGeo, mat);

})();

/* ── 油漆提示牆：提示畫在玩家身後偏左的牆上 ───────────
   斑駁噴漆風格，每局依新答案重畫。回頭讀提示的同時
   必然看到怪物 —— 資訊與威脅耦合在同一個視角裡。 */
function makePaintTexture(order) {
  const w = 512, h = 320;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const P = CFG.paint;

  const cell = w / order.length;
  order.forEach((pinIdx, k) => {
    const cx = cell * (k + 0.5) + (Math.random() - 0.5) * 14;
    const cy = h * 0.42 + (Math.random() - 0.5) * 22;
    const r = cell * 0.30;
    ctx.fillStyle = GLYPH[pinIdx].c;
    ctx.strokeStyle = GLYPH[pinIdx].c;
    ctx.lineWidth = r * 0.34;
    ctx.lineJoin = 'round';
    const rot = (Math.random() - 0.5) * 0.18;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);

    const shape = pinIdx % 4;
    ctx.beginPath();
    if (shape === 0) ctx.arc(0, 0, r, 0, Math.PI * 2);                      // ●
    if (shape === 1) ctx.rect(-r * .85, -r * .85, r * 1.7, r * 1.7);        // ■
    if (shape === 2) { ctx.moveTo(0, -r); ctx.lineTo(r * .95, r * .8);      // ▲
                       ctx.lineTo(-r * .95, r * .8); ctx.closePath(); }
    if (shape === 3) { ctx.moveTo(0, -r * 1.05); ctx.lineTo(r * .8, 0);     // ◆
                       ctx.lineTo(0, r * 1.05); ctx.lineTo(-r * .8, 0); ctx.closePath(); }
    ctx.fill();
    ctx.restore();

    // 流掛：符號下緣往下拖出漸淡的細線
    for (let d = 0; d < P.drips / order.length + 1; d++) {
      const dx = cx + (Math.random() - 0.5) * r * 1.6;
      const dy = cy + r * (0.7 + Math.random() * 0.3);
      const len = 20 + Math.random() * 70;
      const g = ctx.createLinearGradient(0, dy, 0, dy + len);
      g.addColorStop(0, GLYPH[pinIdx].c);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(dx, dy, 2 + Math.random() * 2.5, len);
    }
  });

  // 剝落：隨機挖掉小塊，讓油漆吃進牆的紋理
  ctx.globalCompositeOperation = 'destination-out';
  const holes = w * h * P.erosion / 90;
  for (let i = 0; i < holes; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = 1 + Math.random() * 3.5;
    ctx.globalAlpha = 0.35 + Math.random() * 0.55;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

    const weights = { palm: 1 - rootW };
    const seg = segmentWeights(info.region, info.t);
    for (const [b,w] of Object.entries(seg)) weights[b] = (weights[b]||0) + w*rootW;
    let total = 0; for (const w of Object.values(weights)) total += w;
    influences[vi] = Object.entries(weights).filter(([,w]) => w > 1e-5)
      .map(([bone,w]) => ({ bone, w: w/total }));
  }

  return { pos, idx, vertexInfo, influences, fingerDefs, palmCenterX, fingerNames, S };
})();

/* 關節姿態表（度）。wrench / pick 為佔位版，待 lab 調校後替換 */
const JPOSE = {
  fist:   { index:[68,92,64,0],  middle:[72,98,68,0],  ring:[75,100,70,2],  pinky:[78,102,72,5],  thumb:[48,55,36,-8] },
  side:   { index:[58,78,54,0],  middle:[61,83,58,0],  ring:[64,85,60,2],   pinky:[66,87,61,5],   thumb:[41,47,31,-7] },
  reach:  { index:[12,18,10,-4], middle:[16,22,13,0],  ring:[20,28,18,4],   pinky:[26,34,22,8],   thumb:[16,18,10,12] },
  wrench: { index:[62,88,60,0],  middle:[66,92,64,0],  ring:[70,95,66,2],   pinky:[73,98,68,5],   thumb:[40,50,45,-14] },
  pick:   { index:[38,42,28,-4], middle:[58,70,50,0],  ring:[68,85,60,3],   pinky:[72,92,66,6],   thumb:[30,34,26,6] },
};

const labSkinMat = new THREE.MeshStandardMaterial({
  color: 0xa08a78, roughness: 0.8, metalness: 0, side: THREE.DoubleSide,
});
const GAME_HAND_SCALE = 0.151;   // lab 尺寸 → 真實手長約 19cm

function createLabHand(side) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LAB.pos), 3));
  geometry.setIndex(new THREE.BufferAttribute(LAB.idx, 1));
  geometry.computeVertexNormals();

  // 獨立 rig（不掛進場景，手動更新矩陣）
  const boneMap = {}, inverseBind = {};
  const rigRoot = new THREE.Group();
  const mk = (name, parent, p, restQ) => {
    const b = new THREE.Bone(); b.name = name; b.position.copy(p);
    if (restQ) b.quaternion.copy(restQ);
    parent.add(b); boneMap[name] = b;
    b.userData.restQ = (restQ || new THREE.Quaternion()).clone();
    return b;
  };
  const root = mk('root', rigRoot, new THREE.Vector3());
  const palm = mk('palm', root, new THREE.Vector3());
  for (const n of LAB.fingerNames) {
    const def = LAB.fingerDefs[n], total = def.tip.distanceTo(def.base);
    const [r1, r2] = def.ratios;
    const meta = mk(n+'_meta', palm, def.base);
    const mcp = mk(n+'_mcp', meta, new THREE.Vector3());
    const pip = mk(n+'_pip', mcp, new THREE.Vector3(0, total*r1, 0));
    mk(n+'_dip', pip, new THREE.Vector3(0, total*r2, 0));
  }
  {
    const def = LAB.fingerDefs.thumb, total = def.tip.distanceTo(def.base);
    const dir = def.tip.clone().sub(def.base).normalize();
    const restQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
    const [r1, r2] = def.ratios;
    const cmc = mk('thumb_cmc', palm, def.base, restQ);
    const mcp = mk('thumb_mcp', cmc, new THREE.Vector3(0, total*r1, 0));
    mk('thumb_ip', mcp, new THREE.Vector3(0, total*r2, 0));
  }
  rigRoot.updateMatrixWorld(true);
  for (const [n, b] of Object.entries(boneMap)) inverseBind[n] = b.matrixWorld.clone().invert();

  const current = {}, target = {};
  for (const f of [...LAB.fingerNames, 'thumb']) {
    current[f] = { j1:0, j2:0, j3:0, splay:0 };
    target[f]  = { j1:0, j2:0, j3:0, splay:0 };
  }
  const d2r = THREE.MathUtils.degToRad;
  const setB = (n, e) => { const b = boneMap[n]; if (!b) return;
    b.quaternion.copy(b.userData.restQ).multiply(new THREE.Quaternion().setFromEuler(e)); };

  const tempV = new THREE.Vector3(), accV = new THREE.Vector3(), skinMats = {};
  function skin() {
    for (const n of LAB.fingerNames) {
      const p = current[n];
      setB(n+'_meta', new THREE.Euler(0, 0, d2r(p.splay)));
      setB(n+'_mcp', new THREE.Euler(d2r(p.j1), 0, 0));
      setB(n+'_pip', new THREE.Euler(d2r(p.j2), 0, 0));
      setB(n+'_dip', new THREE.Euler(d2r(p.j3), 0, 0));
    }
    const t = current.thumb;
    setB('thumb_cmc', new THREE.Euler(d2r(t.j1), d2r(t.splay*.45), d2r(-t.splay)));
    setB('thumb_mcp', new THREE.Euler(d2r(t.j2), 0, 0));
    setB('thumb_ip',  new THREE.Euler(d2r(t.j3), 0, 0));
    rigRoot.updateMatrixWorld(true);
    for (const [n, b] of Object.entries(boneMap))
      skinMats[n] = new THREE.Matrix4().multiplyMatrices(b.matrixWorld, inverseBind[n]);
    const out = geometry.attributes.position.array;
    for (let vi = 0; vi < LAB.vertexInfo.length; vi++) {
      const i = vi*3; accV.set(0,0,0);
      for (const inf of LAB.influences[vi]) {
        tempV.set(LAB.pos[i], LAB.pos[i+1], LAB.pos[i+2]).applyMatrix4(skinMats[inf.bone]);
        accV.addScaledVector(tempV, inf.w);
      }
      out[i] = accV.x; out[i+1] = accV.y; out[i+2] = accV.z;
    }
    geometry.attributes.position.needsUpdate = true;
    geometry.computeVertexNormals();
  }

  function setJoints(name) {
    const P = JPOSE[name];
    for (const f of [...LAB.fingerNames, 'thumb']) {
      const a = P[f === 'index' ? 'index' : f] || P[f];
      target[f].j1 = a[0]; target[f].j2 = a[1]; target[f].j3 = a[2]; target[f].splay = a[3];
    }
  }
  function offsetIndex(dj1, dj2) { target.index.j1 += dj1; target.index.j2 += dj2; }

  function update(dt) {
    let dirty = false;
    for (const f in current) for (const k in current[f]) {
      const before = current[f][k];
      current[f][k] = THREE.MathUtils.damp(before, target[f][k], 10, dt);
      if (Math.abs(current[f][k] - before) > 0.05) dirty = true;
    }
    if (dirty) skin();
  }
  skin();

  // 座標轉接：lab 空間（+Y 指尖、+Z 掌心）→ 遊戲手空間（-Z 指尖、-Y 掌心）
  const mesh = new THREE.Mesh(geometry, labSkinMat);
  if (side < 0) mesh.scale.x = -1;         // 左手只鏡像渲染，rig 不鏡像
  const adapter = new THREE.Group();
  {
    const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
    const qz = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), Math.PI);
    adapter.quaternion.multiplyQuaternions(qz, qx);
  }
  adapter.scale.setScalar(GAME_HAND_SCALE);
  adapter.userData.baseQ = adapter.quaternion.clone();
  adapter.add(mesh);

  const g = new THREE.Group();
  g.userData.side = side;
  g.add(adapter);

  // 前臂與袖口（遮手腕接縫）
  const fa = new THREE.Mesh(new THREE.CapsuleGeometry(0.032, 0.26, 3, 9), labSkinMat);
  fa.rotation.x = Math.PI/2 - 0.22;
  fa.position.set(0, -0.035, 0.155); g.add(fa);
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.046, 0.06, 10),
    new THREE.MeshStandardMaterial({ color: 0x2c2f34, roughness: 0.9 }));
  cuff.rotation.x = Math.PI/2 - 0.22;
  cuff.position.set(0, -0.012, 0.055); g.add(cuff);

  return { group: g, side, setJoints, offsetIndex, update, target, adapter };
}

const handState = {

  L: { pron:0, pitch:8, yaw:-28, x:0.255, y:-0.305, z:-0.425, swing:1 },
};
let handShake = 0;

function hTargets() {
  if (hd.on) return { L: $hdPose.value, R: $hdPose.value };
  if (blind()) return { L:'away', R:'away' };
  if (intro.active) {
    if (intro.phase === 'run')    return { L:'run',  R:'run' };
    if (intro.phase === 'handle') return { L:'side', R:'reach' };
    return { L:'wrench', R:'pick' };
  }
  return { L:'wrench', R:'pick' };
}

function hPlace(hand, P, swingPhase, pressF, extra) {
  const side = hand.side;
  const d2r = THREE.MathUtils.degToRad;
  const p = swingPhase + (side > 0 ? 0 : Math.PI);
  const sw = P.swing;
  const swingZ = Math.sin(p) * 0.085 * sw;
  const swingY = (Math.abs(Math.cos(p)) * 0.03 - 0.015) * sw;
  const jx = handShake > 0 ? (Math.random()-0.5)*0.012 : 0;
  const jy = handShake > 0 ? (Math.random()-0.5)*0.012 : 0;
  hand.group.position.set(side*P.x + jx + (extra?.dx||0), P.y + swingY - pressF*0.035 + jy + (extra?.dy||0), P.z + swingZ);
  hand.group.rotation.set(
    d2r(-6 + P.pitch + pressF*20 + Math.sin(p)*14*sw + (extra?.dpitch||0)),
    d2r(side*(6 + P.yaw)),
    d2r(side*(P.pron - 90) + Math.sin(p+0.6)*6*side*sw),
    'YXZ'
  );
}

function updateHands(dt) {
  const tg = hTargets();
  const k = 1 - Math.exp(-9 * dt);
  if (handShake > 0) handShake -= dt;

  for (const key of ['L','R']) {
    const cur = handState[key], want = HPOSE[tg[key]];
    for (const f of ['pitch','yaw','x','y','z','swing'])
      cur[f] += (want[f] - cur[f]) * k;
    const dAng = ((want.pron - cur.pron + 540) % 360) - 180;   // 最短角度路徑
    cur.pron += dAng * k;
  }
  handL.setJoints(HPOSE[tg.L].joints);
  handR.setJoints(HPOSE[tg.R].joints);

  // 撬鎖時右手：食指隨頂針行程伸展（量化三檔，避免每幀重蒙皮）
  let extraR = null;
  if (!intro.active && !blind() && !hd.on) {
    const lv = Math.round(pick.lift * 3) / 3;
    handR.offsetIndex(-lv * 20, -lv * 16);
    extraR = { dx: pickTool.position.x * 0.9, dy: lv * 0.012, dpitch: -lv * 6 };
  }
  const pressF = intro.active && intro.phase === 'handle' ? (intro.press || 0) : 0;

  handL.update(dt); handR.update(dt);
  hPlace(handR, handState.R, intro.bobPhase, pressF, extraR);
  hPlace(handL, handState.L, intro.bobPhase, 0, null);
}

let actx = null;
function beep(kind) {
  actx ??= new (window.AudioContext || window.webkitAudioContext)();
  const t = actx.currentTime;
  const P = { set:['square',1750,6000,.20], falseSet:['square',1180,1300,.16],
              error:['sawtooth',150,800,.10], release:['triangle',320,2000,.10],
              severe:['sawtooth',70,400,.30], face:['sawtooth',58,240,.34], thunk:['square',82,480,.30], solved:['triangle',520,4000,.22],
              death:['sine',48,300,.40] }[kind];
  if (!P) return;
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.connect(f); f.connect(g); g.connect(actx.destination);
  f.type = 'lowpass'; o.type = P[0]; o.frequency.value = P[1]; f.frequency.value = P[2];
  g.gain.setValueAtTime(P[3], t);
  g.gain.exponentialRampToValueAtTime(.0001, t + (kind === 'solved' || kind === 'death' ? .6 : .1));
  o.start(t); o.stop(t + .7);
}
