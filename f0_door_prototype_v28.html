/* ── 機構剖面圖 ───────────────────────────────────────
   風格化，不模擬材質：純色塊 + 輪廓線 + 折線彈簧。
   剪切線是唯一需要理解的東西，其餘都是它的註腳。
   刻意不畫任何角度基準 —— 鎖芯轉了幾度只有門上看得出來。 */
const CUT = {
  housing:'#31343a', housingHi:'#3a3e45', housingLo:'#26292e',
  plug:'#42464d', plugHi:'#4d525a', plugLo:'#33363c',
  keyway:'#141519', chamber:'#1e2025', chamberEdge:'#17181c',
  steel:'#767d86', steelHi:'#8b939d', steelLo:'#5c6169',
  brass:'#997a3d', brassHi:'#b5924c', brassLo:'#77602f',
  spring:'#6a727c', shear:'#c8b98f', line:'#17181c', below:'#101114',
};

/* 垂直圓柱感：左暗、中亮帶、右暗 */
function cylRect(ctx, x0, y0, x1, y1, base, hi, lo) {
  const w = x1 - x0;
  ctx.fillStyle = base; ctx.fillRect(x0, y0, w, y1 - y0);
  ctx.fillStyle = lo;   ctx.fillRect(x0, y0, w * 0.16, y1 - y0);
  ctx.fillStyle = hi;   ctx.fillRect(x0 + w * 0.22, y0, w * 0.24, y1 - y0);
  ctx.fillStyle = lo;   ctx.fillRect(x1 - w * 0.14, y0, w * 0.14, y1 - y0);
}

/* 撬針的即時姿態：橫移跟選針、上推時尖端頂起栓（供上下同步與動畫用） */
const pick = { x: 0, lift: 0 };

function drawCutaway(tint = 0) {
  if (!cutCtx) return;
  const w = $pins.clientWidth, h = $pins.clientHeight;
  const n = CFG.lock.pinCount;
  const ctx = cutCtx;
  const now = performance.now();

  // 佈局（比例沿用風格草圖）
  const TOP = h * 0.075, SHEAR = h * 0.475, PLUG_BOT = h * 0.755;
  const KEY_T = h * 0.645, KEY_B = h * 0.71;
  const CAP_R = h * 0.16;                       // 鎖芯端蓋
  const left = CAP_R * 2.1;                     // 栓室區從端蓋右側開始
  const cell = (w - left) / n;
  const CW = Math.min(cell * 0.62, 86), PW = Math.min(cell * 0.40, 54);
  const DRIVER = h * 0.145, KEYPIN = h * 0.13;
  const cxOf = i => left + cell * (i + 0.5);

  ctx.clearRect(0, 0, w, h);

  // ── 殼體 ──
  ctx.fillStyle = CUT.housing;   ctx.fillRect(0, TOP, w, SHEAR - TOP);
  ctx.fillStyle = CUT.housingHi; ctx.fillRect(0, TOP, w, h * 0.018);
  ctx.fillStyle = CUT.housingLo; ctx.fillRect(0, SHEAR - h * 0.02, w, h * 0.02);

  // ── 鎖芯（水平圓柱）──
  ctx.fillStyle = CUT.plug;   ctx.fillRect(0, SHEAR, w, PLUG_BOT - SHEAR);
  ctx.fillStyle = CUT.plugLo; ctx.fillRect(0, SHEAR, w, h * 0.038);
  ctx.fillStyle = CUT.plugHi; ctx.fillRect(0, SHEAR + h * 0.07, w, h * 0.09);
  ctx.fillStyle = CUT.plugLo; ctx.fillRect(0, PLUG_BOT - h * 0.045, w, h * 0.045);
  ctx.fillStyle = CUT.below;  ctx.fillRect(0, PLUG_BOT, w, h - PLUG_BOT);

  // ── 鑰匙道 ──
  ctx.fillStyle = CUT.keyway; ctx.fillRect(0, KEY_T, w, KEY_B - KEY_T);
  ctx.fillStyle = '#0a0b0d';  ctx.fillRect(0, KEY_T, w, 2.5);

  // ── 剪切線：貫穿全寬，介面的主角 ──
  ctx.strokeStyle = CUT.shear; ctx.globalAlpha = 0.42; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, SHEAR); ctx.lineTo(w, SHEAR); ctx.stroke();
  ctx.globalAlpha = 1;

  // ── 栓室與栓 ──
  const seamOf = st =>
    st === 'idle'     ? SHEAR + h * 0.115
  : st === 'partial'  ? SHEAR + h * 0.115 * (1 - CFG.lock.partialH)
  : st === 'falseSet' ? SHEAR - h * 0.028
  : SHEAR;

  for (let i = 0; i < n; i++) {
    const cx = cxOf(i), st = R.lock.pins[i];
    const x0 = cx - PW / 2, x1 = cx + PW / 2;

    // 栓室
    ctx.fillStyle = CUT.chamberEdge;
    ctx.fillRect(cx - CW / 2, TOP + h * 0.04, CW, KEY_T - TOP - h * 0.04);
    ctx.fillStyle = CUT.chamber;
    ctx.fillRect(cx - CW / 2 + 2.5, TOP + h * 0.04, CW - 5, KEY_T - TOP - h * 0.04);

    // 栓室內的剪切線段（半透明，讓整條線連續）
    ctx.strokeStyle = CUT.shear; ctx.globalAlpha = 0.30; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - CW / 2, SHEAR); ctx.lineTo(cx + CW / 2, SHEAR); ctx.stroke();
    ctx.globalAlpha = 1;

    let seam = seamOf(st);
    // 選中的栓被工具頂起時的即時位移（尚未鬆手的視覺）
    if (i === sel && pick.lift > 0 && (st === 'idle' || st === 'partial')) {
      seam -= pick.lift * h * 0.06;
    }

    // 彈簧
    const sTop = TOP + h * 0.065, sBot = seam - DRIVER - h * 0.015;
    ctx.strokeStyle = CUT.spring; ctx.lineWidth = 2.2;
    ctx.beginPath();
    const coils = 5;
    for (let c = 0; c <= coils * 2; c++) {
      const yy = sTop + Math.max(6, sBot - sTop) * c / (coils * 2);
      const xx = cx + (c % 2 ? PW * 0.34 : -PW * 0.34);
      c === 0 ? ctx.moveTo(cx, yy) : ctx.lineTo(xx, yy);
    }
    ctx.lineTo(cx, sBot + 3); ctx.stroke();

    // 驅動栓（鋼）＋暗色端面
    cylRect(ctx, x0, seam - DRIVER, x1, seam, CUT.steel, CUT.steelHi, CUT.steelLo);
    ctx.fillStyle = CUT.steelLo;
    ctx.beginPath(); ctx.ellipse(cx, seam - DRIVER, PW / 2, h * 0.016, 0, 0, 6.283); ctx.fill();

    // 鑰匙栓（銅）＋圓底
    const kb = Math.min(seam + KEYPIN, KEY_T - 2);
    cylRect(ctx, x0, seam, x1, kb, CUT.brass, CUT.brassHi, CUT.brassLo);
    ctx.fillStyle = CUT.brassHi; ctx.strokeStyle = CUT.brassLo; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx, kb, PW / 2, h * 0.02, 0, 0, 6.283); ctx.fill(); ctx.stroke();

    // 接縫
    ctx.strokeStyle = CUT.line; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, seam); ctx.lineTo(x1, seam); ctx.stroke();

    // 到位：該栓位剪切線加亮
    if (st === 'set') {
      ctx.strokeStyle = CUT.shear; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx - CW / 2 - 5, SHEAR); ctx.lineTo(cx + CW / 2 + 5, SHEAR); ctx.stroke();
    }
    // 假到位：驅動栓底卡在剪切線台階
    if (st === 'falseSet') {
      ctx.fillStyle = CUT.plugHi; ctx.strokeStyle = CUT.line; ctx.lineWidth = 1;
      ctx.fillRect(cx - CW / 2 - 5, SHEAR - 2, (CW - PW) / 2 + 4, h * 0.028);
      ctx.strokeRect(cx - CW / 2 - 5, SHEAR - 2, (CW - PW) / 2 + 4, h * 0.028);
      ctx.fillRect(cx + PW / 2 + 1, SHEAR - 2, (CW - PW) / 2 + 4, h * 0.028);
      ctx.strokeRect(cx + PW / 2 + 1, SHEAR - 2, (CW - PW) / 2 + 4, h * 0.028);
    }

    // 檢修漆點（殼體上緣）
    ctx.fillStyle = GLYPH[i].c; ctx.globalAlpha = 0.9;
    ctx.font = `${Math.min(cell * 0.24, 17)}px ui-monospace, Menlo, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(GLYPH[i].s, cx, TOP + h * 0.022 + 8);
    ctx.globalAlpha = 1;

    // 選中框
    if (i === sel) {
      ctx.strokeStyle = '#c8b98f'; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5;
      ctx.strokeRect(cx - CW / 2 - 4, TOP + 2, CW + 8, KEY_B - TOP + 4);
      ctx.globalAlpha = 1;
    }
    // 錯誤閃爍
    if ((flashUntil[i] || 0) > now) {
      ctx.fillStyle = 'rgba(165,103,95,.30)';
      ctx.fillRect(cx - cell / 2, 0, cell, h);
    }
  }

  // ── 鎖芯端蓋：完整的圓，張力扳手插在圓面上、隨鎖芯轉 ──
  {
    const capX = CAP_R * 1.05, capY = (SHEAR + PLUG_BOT) / 2;
    ctx.fillStyle = CUT.plugHi; ctx.strokeStyle = CUT.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(capX, capY, CAP_R, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = CUT.plug;
    ctx.beginPath(); ctx.arc(capX, capY, CAP_R * 0.72, 0, 6.283); ctx.fill();

    const ang = -THREE.MathUtils.degToRad(R.lock.cylinderDeg);
    ctx.save(); ctx.translate(capX, capY); ctx.rotate(ang);
    // 端面上的鑰匙孔縫
    ctx.fillStyle = CUT.keyway;
    ctx.fillRect(-CAP_R * 0.1, -CAP_R * 0.62, CAP_R * 0.2, CAP_R * 1.24);
    // 張力扳手：插進縫裡，柄向下伸出端蓋
    ctx.fillStyle = CUT.steel;
    ctx.fillRect(-3.5, CAP_R * 0.1, 7, CAP_R * 1.7);
    ctx.fillStyle = CUT.steelHi;
    ctx.fillRect(-3.5, CAP_R * 0.1, 3, CAP_R * 1.7);
    ctx.restore();
  }

  // ── 撬針：從鑰匙道伸入，尖端頂在選中栓下方（加粗版）──
  {
    const targetX = cxOf(sel);
    pick.x += (targetX - pick.x) * 0.35;         // 每幀重畫，直接就地平滑
    const py = (KEY_T + KEY_B) / 2;
    const bend = pick.x - PW * 0.9;
    const tipY = KEY_T - 3 - pick.lift * h * 0.055;

    ctx.lineCap = 'round';
    ctx.strokeStyle = CUT.steelLo; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(6, py + 2); ctx.lineTo(bend, py + 2); ctx.stroke();
    ctx.strokeStyle = CUT.steelHi; ctx.lineWidth = 6.5;
    ctx.beginPath(); ctx.moveTo(6, py); ctx.lineTo(bend, py);
    ctx.lineTo(pick.x - 4, tipY); ctx.stroke();
    ctx.fillStyle = CUT.steelHi;
    ctx.beginPath(); ctx.arc(pick.x - 4, tipY, 4, 0, 6.283); ctx.fill();
    ctx.lineCap = 'butt';
  }

  // ── 威脅滲入 ──
  if (tint > 0) {
    const g = ctx.createLinearGradient(0, h * 0.4, 0, h);
    g.addColorStop(0, 'rgba(140,30,26,0)');
    g.addColorStop(1, `rgba(140,30,26,${tint})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
}

function renderPins() {
  if (CFG.ui.style === 'cutaway') drawCutaway(CFG.dread.tint[ST.index] || 0);
  else tracks.forEach((tr, i) => {
    const st = R.lock.pins[i];
    const frac = st === 'idle' ? 0 : st === 'partial' ? CFG.lock.partialH : 1;
    const pin = tr.querySelector('.pin');
    pin.style.bottom = `calc(${frac * 100}% * 0.80 + 2px)`;
    pin.style.opacity = frac === 0 ? .55 : 1;
    tr.classList.toggle('sel', i === sel);
  });

  $seq.innerHTML = R.history.length
    ? R.history.map(h => {
        const cls = h.r === 'set' ? 'ok' : h.r === 'falseSet' ? 'fake' : 'err';
        const m = h.r === 'set' ? '✓' : h.r === 'falseSet' ? '?' : '✕';
        return `<span class="step ${cls}" style="color:${GLYPH[h.i].c}">${GLYPH[h.i].s}<small>${m}</small></span>`;
      }).join('')
    : '';
}

function flashTrack(i) {
  if (CFG.ui.style === 'cutaway') { flashUntil[i] = performance.now() + 130; return; }
  const f = tracks[i].querySelector('.flash');
  f.style.opacity = .35; setTimeout(() => f.style.opacity = 0, 110);
}

/* ── 新回合 ─────────────────────────────────────────── */
function newRound() {
  R.lock = new LockState({ ...CFG.lock });
  R.t0 = performance.now(); R.elapsed = 0;
  R.over = false; R.won = false;
  R.lookTime = 0; R.jamTime = 0; R.jamStart = 0;
  R.errorCount = 0; R.severeCount = 0; R.extraTime = 0;
  R.history = []; sel = 0;
  look.yaw = 0; look.target = 0; look.holding = false;

  R.lock.on('set', () => beep('set'));
  R.lock.on('falseSet', () => { beep('falseSet'); R.jamStart = performance.now(); });
  R.lock.on('error', d => { beep('error'); flashTrack(d.i ?? d.pin); R.errorCount++; });
  R.lock.on('severe', () => {
    beep('severe'); R.severeCount++; handShake = 0.4;
    R.extraTime += CFG.penalty.severeJump;      // 怪物瞬間前進
  });
  R.lock.on('release', d => {
    if (d.was === 'falseSet' && R.jamStart) { R.jamTime += performance.now() - R.jamStart; R.jamStart = 0; }
  });
  R.lock.on('releaseAll', () => {
    if (R.jamStart) { R.jamTime += performance.now() - R.jamStart; R.jamStart = 0; }
  });
  R.lock.on('solved', () => win());

  // 站位時刻表：把 hold 比例累加成切換時間點。總時間守恆（議題 14）
  const S = CFG.stations;
  ST.thresholds = [];
  let acc = 0;
  for (let i = 0; i < S.hold.length; i++) {
    acc += S.hold[i];
    ST.thresholds.push(acc * CFG.round.limit);
  }
  ST.index = 0; ST.z = S.z[0]; ST.targetZ = S.z[0];
  decay.applied = 0;
  window.__applySeep(0);
  for (const m of decayGroup.children) m.visible = false;
  decayGroup.userData.farLight.intensity = 1.0;
  decayGroup.userData.farTube.material.color.set(0x93a4bd);
  scene.fog.density = CFG.fog.density;
  monster.visible = false;
  ST.moveT = 0; ST.pendingJump = false;
  ST.stareT = 0; ST.blink = 0; ST.seen = false;
  ST.phase = 'off'; ST.emptyGot = 0; ST.glanceT = 0; ST.counted = false;
  ST.faceT = 0; ST.faceMode = 0; ST.readyOff = false; ST.armedT = 0;
  ST.front = null; ST.frontT = 0; ST.frontCool = 0;
  ST.frontLeft = S.frontMin + Math.floor(Math.random() * (S.frontMax - S.frontMin + 1));
  ST.frontPool = ['eye', 'refl', 'lever'].sort(() => Math.random() - 0.5);  // 每局輪替順序
  keyEye.visible = false;
  reflection.mesh.visible = false; reflection.mat.opacity = 0;
  ST.emptyNeed = S.lurkEmptyMin +
    Math.floor(Math.random() * (S.lurkEmptyMax - S.lurkEmptyMin + 1));
  R.nextKick = CFG.dread.kickbackSec;
  R.nextDrop = CFG.dread.dropSec;

  buildPins(); renderPins();
  repaint();
  intro.active = true; intro.phase = 'run'; intro.t = 0;
  intro.z = CFG.intro.runFrom; intro.bobPhase = 0; intro.arriveF = 0;
  intro.beeped = intro.th1 = intro.th2 = intro.thTool = false;
  look.yaw = 0; look.target = 0;
  doorLever.rotation.z = 0; door.position.x = 0;
  pickTool.visible = wrench.visible = false;
  pickTool.userData.insert = wrench.userData.insert = 0.12;
  pickTool.position.z = wrench.position.z = 0.12;
  $fade.classList.remove('on');
}

/* ── 結束 ───────────────────────────────────────────── */
function win() {
  if (R.over) return;
  R.over = true; R.won = true;
  beep('solved');
  const clutch = R.elapsed > CFG.round.limit;
  endRound(clutch ? '極限逃脫' : '逃脫成功');
}

function primaryCause() {
  const c = [
    ['卡在假針太久',   R.jamTime / 1000],
    ['回頭看太多次',   R.lookTime / 1000],
    ['連續操作錯誤',   R.errorCount * CFG.penalty.errorSec],
  ].sort((a, b) => b[1] - a[1])[0];
  return c[1] > 1.5 ? c[0] : '時間不夠';
}

function die() {
  if (R.over) return;
  R.over = true; R.won = false;
  beep('death');
  endRound(primaryCause());
}

function endRound(msg) {
  if (R.jamStart) { R.jamTime += performance.now() - R.jamStart; R.jamStart = 0; }
  R.attempts.push({
    won: R.won, sec: R.elapsed, look: R.lookTime / 1000,
    jam: R.jamTime / 1000, errors: R.errorCount, msg,
  });
  $fade.querySelector('div').textContent = msg;
  $fade.classList.add('on');
  setTimeout(newRound, 1500);
}

/* ═══════════════════════════════════════════════════════════
   輸入
   ═══════════════════════════════════════════════════════════ */
const blind = () => Math.abs(look.yaw) > CFG.look.blindAt;

/* 下方：撬鎖 */
let drag = null;
$pins.addEventListener('pointerdown', e => {
  if (R.over || blind() || intro.active) return;
  let idx;
  if (CFG.ui.style === 'cutaway') {
    const rect = $pins.getBoundingClientRect();
    const capL = rect.height * 0.16 * 2.1;
    const w = (rect.width - capL) / CFG.lock.pinCount;
    idx = Math.max(0, Math.min(CFG.lock.pinCount - 1, Math.floor((e.clientX - rect.left - capL) / w)));
  } else {
    const tr = e.target.closest('.track'); if (!tr) return;
    idx = +tr.dataset.i;
  }
  $pins.setPointerCapture(e.pointerId);
  sel = idx;
  drag = { y: e.clientY, acted: false };
  renderPins();
});
$pins.addEventListener('pointermove', e => {
  if (!drag || R.over) return;
  const rect = $pins.getBoundingClientRect();
  const capL = CFG.ui.style === 'cutaway' ? rect.height * 0.16 * 2.1 : 0;
  const w = (rect.width - capL) / CFG.lock.pinCount;
  const idx = Math.max(0, Math.min(CFG.lock.pinCount - 1, Math.floor((e.clientX - rect.left - capL) / w)));
  if (idx !== sel) { sel = idx; drag.acted = false; drag.y = e.clientY; renderPins(); }
  const dy = drag.y - e.clientY;
  pick.lift = drag.acted ? 0 : Math.max(0, Math.min(1, dy / 20));   // 工具頂栓的即時行程
  if (!drag.acted && dy >  20) { doPush(sel);    drag.acted = true; pick.lift = 0; }
  if (!drag.acted && dy < -20) { doRelease(sel); drag.acted = true; pick.lift = 0; }
});
$pins.addEventListener('pointerup', () => {
  if (drag && !drag.acted) doPush(sel);          // 單點 = 頂針
  drag = null; pick.lift = 0;
});
$pins.addEventListener('pointercancel', () => { drag = null; pick.lift = 0; });

document.getElementById('dump').onclick = () => {
  if (R.over || blind() || intro.active) return;
  R.lock.releaseAll(); beep('release'); R.history = []; renderPins();
};

function doPush(i) {
  if (R.over || blind()) return;
  const r = R.lock.push(i);
  if (r === 'ignored') return;
  R.history.push({ i, r });
  renderPins();
}
function doRelease(i) {
  if (R.over || blind()) return;
  R.lock.release(i); beep('release');
  R.history.push({ i, r: 'released' });
  renderPins();
}

/* 上方：長按觀察、放開回彈（議題 1 規格） */
view.addEventListener('pointerdown', e => {
  if (intro.active) return;
  view.setPointerCapture(e.pointerId);
  look.holding = true;
  look.target = 180;
});
const stopLook = () => { look.holding = false; look.target = 0; };
view.addEventListener('pointerup', stopLook);
view.addEventListener('pointercancel', stopLook);

addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= CFG.lock.pinCount) { e.shiftKey ? doRelease(n - 1) : doPush(n - 1); }
  if (e.key === 's') { look.holding = true; look.target = 180; }
  if (e.key === ' ') { e.preventDefault(); document.getElementById('dump').click(); }
  if (e.key === 'd') { devOn = !devOn; $dev.style.display = devOn ? 'block' : 'none'; }
  if (e.key === 'h') {
    hd.on = !hd.on;
    $hdbg.style.display = hd.on ? 'block' : 'none';
    if (hd.on) { intro.active = false; hdSync(); }
  }
  if (e.key === 'u') {                                  // 換皮 A/B，狀態機不受影響
    CFG.ui.style = CFG.ui.style === 'cutaway' ? 'bars' : 'cutaway';
    $pins.style.transform = '';
    buildPins(); renderPins();
  }
});
addEventListener('keyup', e => { if (e.key === 's') { look.holding = false; look.target = 0; } });

/* ═══════════════════════════════════════════════════════════
   主迴圈
   ═══════════════════════════════════════════════════════════ */
function resize() {
  sizeCut();
  const w = view.clientWidth, h = view.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  const d = Math.abs(vig.position.z);
  const vh = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * d;
  vig.scale.set(vh * camera.aspect * 1.02, vh * 1.02, 1);
  vigMat.uniforms.uAspect.value = camera.aspect;
}
addEventListener('resize', resize);

const clock = new THREE.Clock();

let timeScale = 1;
function tick() {
  let dt = Math.min(clock.getDelta(), 0.05);
  dt *= timeScale;

  if (!R.over) {
    if (hd.on) R.t0 = performance.now();           // debug 中計時凍結
    if (intro.active) {
      intro.t += dt;
      R.t0 = performance.now();                          // 開場期間計時器不啟動
      const I = CFG.intro;

      if (intro.phase === 'run') {
        const p = Math.min(1, intro.t / I.runSec);
        intro.z = I.runFrom * Math.pow(1 - p, 1.55);     // 起步快、到門前減速
        const speedF = 0.35 + (1 - p);
        intro.bobPhase += dt * I.bobFreq * speedF;
        intro.bobY = Math.sin(intro.bobPhase * 2) * I.bobAmp * speedF;
        intro.roll = Math.sin(intro.bobPhase) * I.rollAmp * speedF;
        intro.arriveF = p * p;

        // 經過提示牆：角色轉頭看一眼 + 子彈時間。
        // 有號距離的非對稱梯形：提前減速、過了牆就快速恢復。
        const d = intro.z - CFG.paint.wallZ;              // 正 = 還沒到
        const ss = (a, b, x) => { const u = Math.max(0, Math.min(1, (x - a) / (b - a)));
                                  return u * u * (3 - 2 * u); };
        const g = d >= I.glanceEnter ? 0
                : d >= I.glanceFull  ? ss(I.glanceEnter, I.glanceFull, d)
                : d >= I.glancePast  ? 1
                : d >= I.glanceExit  ? ss(I.glanceExit, I.glancePast, d)
                : 0;

        // 頭跟著牆轉：遠時角度小，牆到身側時最大 —— 起訖點自然
        const ahead = Math.max(0.2, d);
        const trackYaw = Math.min(I.glanceMaxYaw,
          THREE.MathUtils.radToDeg(Math.atan2(CFG.world.corridorW / 2, ahead)));
        look.yaw = trackYaw * g;
        timeScale = 1 - (1 - I.glanceSlow) * g;
        if (!intro.beeped && d < I.glanceEnter) { intro.beeped = true; beep('tap'); }

        if (p >= 1) { intro.phase = 'handle'; intro.t = 0; intro.z = 0;
                      intro.bobY = 0; intro.roll = 0; look.yaw = 0; timeScale = 1; }
      }

      else if (intro.phase === 'handle') {
        intro.arriveF = 1;
        const p = Math.min(1, intro.t / I.handleSec);
        // 兩次壓把手：把手下壓、門晃動、金屬悶響 —— 鎖死了
        const pulse = (a, b) => p > a && p < b ? Math.sin((p - a) / (b - a) * Math.PI) : 0;
        const press = pulse(0.06, 0.42) + pulse(0.52, 0.88);
        intro.press = press;
        doorLever.rotation.z = -0.55 * press;
        door.position.x = press > 0.6 ? Math.sin(intro.t * 55) * 0.004 : 0;
        if (!intro.th1 && p > 0.10) { intro.th1 = true; beep('thunk'); }
        if (!intro.th2 && p > 0.56) { intro.th2 = true; beep('thunk'); }
        if (p >= 1) { intro.phase = 'tool'; intro.t = 0; intro.press = 0; doorLever.rotation.z = 0; door.position.x = 0; }
      }

      else if (intro.phase === 'tool') {
        // 門鎖死了 —— 掏出工具：扳手先入孔，撬針跟上
        const p = Math.min(1, intro.t / I.toolSec);
        const ease = x => x * x * (3 - 2 * x);
        const wp = Math.min(1, p / 0.5);                  // 前半：扳手
        const pp = Math.max(0, (p - 0.40) / 0.6);         // 後半：撬針（略重疊）
        wrench.visible = true;
        wrench.position.z = 0.12 * (1 - ease(wp));
        if (pp > 0) { pickTool.visible = true; pickTool.position.z = 0.12 * (1 - ease(pp)); }
        if (!intro.thTool && wp >= 1) { intro.thTool = true; beep('release'); }   // 扳手到位的輕響
        if (p >= 1) {
          pickTool.position.z = wrench.position.z = 0;
          intro.active = false; look.target = 0;
        }
      }
    }
    R.elapsed = (performance.now() - R.t0) / 1000 + R.extraTime;
    if (look.holding) R.lookTime += dt * 1000;
  }

  // 視角
  const k = 1 - Math.exp(-CFG.look.returnSpeed * dt);
  look.yaw += (look.target - look.yaw) * k;
  const toolDip = intro.active && intro.phase === 'tool' ? -2.5 : 0;
  const pitch = (-7 * intro.arriveF + toolDip) * (1 - Math.min(1, Math.abs(look.yaw) / 90));
  camera.rotation.set(THREE.MathUtils.degToRad(pitch),
                      THREE.MathUtils.degToRad(look.yaw),
                      THREE.MathUtils.degToRad(intro.roll || 0), 'YXZ');
  const standX = 0.30 * intro.arriveF * (1 - Math.min(1, Math.abs(look.yaw) / 90));
  const camZ = intro.active && intro.phase === 'run' ? intro.z : 0;
  camera.position.set(standX,
    1.60 + intro.bobY + Math.sin(performance.now() / 900) * 0.006, camZ);
  $panel.classList.toggle('blind', blind() || R.over || intro.active);

  // 鎖芯：事實層。鑰匙孔與兩支工具都掛在它底下，一起轉。
  cylinder.rotation.z = -THREE.MathUtils.degToRad(R.lock.cylinderDeg);

  // 撬針在孔內的行程：橫向選栓（幅度很小，不能離開孔）＋ 上頂
  {
    const n = Math.max(1, CFG.lock.pinCount - 1);
    const tx = (sel / n - 0.5) * 0.034;                 // 孔寬之內
    const st = R.lock.pins[sel];
    const base = st === 'idle' ? 0 : st === 'partial' ? 0.006 : 0.014;
    const ty = -0.010 + base + pick.lift * 0.008;
    const kd = 1 - Math.exp(-16 * dt);
    pickTool.position.x += (tx - pickTool.position.x) * kd;
    pickTool.position.y += (ty - pickTool.position.y) * kd;
    // 沒入深度隨頂針動作微調，讀得出「正在使力」
    pickTool.userData.shaft.position.z = 0.030 - pick.lift * 0.006;
    // 張力扳手：施力時柄微微下沉
    wrench.rotation.z = -0.02 - pick.lift * 0.03;
  }

  // 提示牆指示燈：平時慢速呼吸，奔跑接近時急閃
  {
    const nearWall = intro.active && intro.phase === 'run' &&
                     Math.abs(intro.z - CFG.paint.wallZ) < 2.4;
    const hz = nearWall ? 9 : 1.1;
    const p = Math.max(0, Math.sin(performance.now() / 1000 * hz * 6.283)) ** 2;
    markerMat.color.setRGB(0.85 * (0.25 + 0.75 * p), 0.70 * (0.25 + 0.75 * p), 0.35 * (0.25 + 0.75 * p));
    markerLight.intensity = (nearWall ? 1.6 : 0.5) * p;
  }

  seepUni.uTime.value += dt / Math.max(0.05, timeScale);   // 真實時間，不吃慢動作

  // 灰塵緩慢飄動
  dust.rotation.y += dt * 0.012;
  dust.position.y = Math.sin(performance.now() / 4200) * 0.05;

  // 怪物：誠實的等速接近
  const f = Math.min(1, R.elapsed / CFG.round.limit);

  // ── 怪物：離散站位。移動只發生在玩家低頭時 ──────────
  {
    const S = CFG.stations, D = CFG.dread;

    // 該到下一站了嗎
    let want = 0;
    for (let i = 0; i < ST.thresholds.length; i++) if (R.elapsed >= ST.thresholds[i]) want = i + 1;
    want = Math.min(want, S.z.length - 1);
    if (want > ST.index && !R.over) ST.pendingJump = true;

    // 凝視計時：一直盯著會鎖住牠，但鎖不了太久
    ST.stareT = blind() ? ST.stareT + dt : 0;
    const stareForced = ST.pendingJump && ST.stareT > S.stareLimit;

    // 換站條件：玩家沒在看，或凝視太久（此時藉燈閃遮掩位移）
    if (ST.pendingJump && (!blind() || stareForced)) {
      ST.index = Math.min(ST.index + 1, want);      // 一次只前進一站，不跳過任何一站
      ST.targetZ = S.z[ST.index];
      ST.moveT = S.settleMs / 1000;
      ST.pendingJump = ST.index < want;             // 還沒追上就留著，下一個時機繼續
      if (stareForced) { ST.blink = S.blinkSec; ST.stareT = 0; }
    }
    if (ST.blink > 0) ST.blink -= dt;
    // 環境劣化：同一條規則，只在低頭時發生
    while (decay.applied < ST.index && !blind()) {
      decayStages[decay.applied]?.();
      decay.applied++;
      window.__applySeep(CFG.seep.level[decay.applied] ?? 0);
    }
    // ── 潛伏：抵達最後一站後，牠不在那裡 ──────────────
    // 每次回頭看到空走廊算一次；累積夠了，下一次回頭牠就貼在你臉上。
    // 觸發權在玩家手上，所以絕不會錯過，而且愛看的人比較快遇到。
    if (ST.phase === 'off' && ST.index >= S.z.length - 1 && !R.over) {
      ST.phase = 'lurk'; ST.glanceT = 0; ST.counted = false;
    }

    if (ST.phase === 'lurk') {
      if (blind()) {
        ST.glanceT += dt;
        // 看滿門檻算一次；持續盯著的話每隔一段再算一次（盯空走廊也是一種空無）
        const due = ST.counted ? S.lurkGlanceMin + S.lurkStareRecount : S.lurkGlanceMin;
        if (ST.glanceT >= due) {
          ST.counted = true; ST.glanceT = S.lurkGlanceMin;
          ST.emptyGot++;
          if (ST.emptyGot >= ST.emptyNeed) { ST.phase = 'armed'; ST.armedT = 0; }
        }
      } else { ST.glanceT = 0; ST.counted = false; }
    }
    else if (ST.phase === 'armed') {
      // 兩種兌現方式：轉回門鎖後再回頭，或盯著空走廊盯到牠出現
      if (!blind()) { ST.readyOff = true; ST.armedT = 0; }
      else ST.armedT += dt;
      if (blind() && (ST.readyOff || ST.armedT > S.armedStareSec)) {
        ST.phase = 'face'; ST.faceT = 0;
        ST.faceMode = Math.random() < 0.5 ? 0 : 1;   // 0 = 已經在那裡, 1 = 從下方升起
        ST.front = null; keyEye.visible = false;
        reflection.mesh.visible = false; doorLever.rotation.z = 0; door.position.x = 0;
        beep('face');
      }
    }
    else if (ST.phase === 'face') {
      ST.faceT += dt;
      // 保底：整局沒遇過正面事件的人（例如全程盯著走廊），
      // 在極限窗口轉回門鎖的瞬間補一次門把 —— 出路也不安全。
      if (ST.frontLeft > 0 && !ST.front && !blind() && ST.faceT > 0.05) {
        ST.front = 'lever'; ST.frontT = 0; ST.frontLeft = 0; beep('thunk');
      }
    }

    // ── 正面事件：潛伏期間，威脅也會出現在門這一側 ──────
    // 絕不致命、絕不擋操作 —— 純粹告訴你「正面也不安全」。
    if (ST.frontCool > 0) ST.frontCool -= dt;
    if (!ST.front && ST.frontLeft > 0 && ST.frontCool <= 0 &&
        (ST.phase === 'lurk' || ST.phase === 'armed') && !blind() && !R.over) {
      ST.front = ST.frontPool[(S.frontMax - ST.frontLeft) % ST.frontPool.length];
      ST.frontT = 0; ST.frontLeft--;
      if (ST.front === 'lever') beep('thunk');
    }

    if (ST.front) {
      ST.frontT += dt;
      const dur = ST.front === 'eye'   ? S.frontDurEye
                : ST.front === 'refl'  ? S.frontDurRefl : S.frontDurLever;
      const p = Math.min(1, ST.frontT / dur);
      const fade = Math.min(1, p / 0.12) * (1 - Math.min(1, Math.max(0, (p - 0.80) / 0.20)));

      if (ST.front === 'eye') {
        keyEye.visible = true;
        // 眨眼：兩次，眼瞼從上下闔起
        const blinkAt = [0.34, 0.72];
        let lid = 0;
        for (const b of blinkAt) {
          const d = Math.abs(p - b);
          if (d < 0.055) lid = Math.max(lid, 1 - d / 0.055);
        }
        const open = 0.019 * (1 - lid * 0.92);
        keyEye.userData.lidT.position.y = open;
        keyEye.userData.lidB.position.y = -open;
        keyEye.userData.iris.position.x = Math.sin(ST.frontT * 1.6) * 0.0016;   // 緩慢掃視
        if (p >= 1) { keyEye.visible = false; ST.front = null; ST.frontCool = S.frontGapSec; }
      }
      else if (ST.front === 'refl') {
        reflection.mesh.visible = true;
        reflection.mat.opacity = 0.62 * fade;
        reflection.mesh.position.x = 0.20 + Math.sin(ST.frontT * 2.3) * 0.012;   // 水面擾動
        reflection.mesh.scale.y = 1.15 + Math.sin(ST.frontT * 1.7) * 0.03;
        if (p >= 1) { reflection.mesh.visible = false; ST.front = null; ST.frontCool = S.frontGapSec; }
      }
      else {  // lever：門把從另一側被壓下，門在框裡晃
        const press = Math.sin(Math.min(1, p / 0.7) * Math.PI);
        doorLever.rotation.z = -0.5 * press;
        door.position.x = press > 0.5 ? Math.sin(ST.frontT * 61) * 0.004 : 0;
        if (p >= 1) {
          doorLever.rotation.z = 0; door.position.x = 0;
          ST.front = null; ST.frontCool = S.frontGapSec;
        }
      }
    }

    // 站位可見性 + 微生命（可見時：呼吸與歪頭，但絕不前進）
    let vis = S.vis[ST.index] > 0;
    if (ST.phase === 'lurk' || ST.phase === 'armed') vis = false;   // 潛伏中：空的
    if (ST.phase === 'face') vis = true;
    if (vis && blind()) ST.seen = true;             // 記錄玩家真的看到過
    if (ST.index >= S.z.length - 1 && !ST.seen && ST.phase === 'off') vis = true;
    monster.visible = (vis && ST.blink <= 0) || R.over;

    // 貼臉：位置、升起演出、微微逼近
    if (ST.phase === 'face') {
      const rise = ST.faceMode === 1
        ? Math.min(1, ST.faceT / S.faceRiseSec) : 1;
      const ease = rise * rise * (3 - 2 * rise);
      monster.position.z = S.faceZ + 0.10 * (1 - ease);
      // 俯身湊到你的視線高度 —— 不是牠變矮，是牠彎下來看你
      monster.position.y = FACE_DROP * ease - 1.55 * (1 - ease);
      monster.rotation.y = 0;                  // 建構時已面向 -z（玩家方向）
      monster.position.x = Math.sin(ST.faceT * 2.2) * 0.012;
      monsterTorso.rotation.x = THREE.MathUtils.degToRad(MP.hunch * 0.55) * ease;
    } else {
      monster.position.y = 0;
      monsterTorso.rotation.x = 0;
    }
    if (monster.visible) {
      const b = Math.sin(R.elapsed * 1.7) * 0.5 + 0.5;
      monsterTorso.scale.y = 1 + b * 0.012;                    // 軀幹呼吸
      monsterTorso.rotation.z = Math.sin(R.elapsed * 0.31) * 0.008;
      monsterHead.rotation.z = THREE.MathUtils.degToRad(MP.headTilt) +
        Math.sin(R.elapsed * 0.43) * 0.06;                     // 頭永遠歪著
    }

    // 極短的位移：讀起來像瞬移，不像走路
    if (ST.moveT > 0) {
      ST.moveT = Math.max(0, ST.moveT - dt);
      const k = 1 - Math.exp(-16 * dt);
      ST.z += (ST.targetZ - ST.z) * k;
    } else ST.z = ST.targetZ;

    monster.position.set(0, 0, ST.z);
    monster.rotation.y = 0;                    // 面向 -z 即面向玩家（建構時已朝向）
  }
  const dist = ST.z;

  // 燈：壞掉的日光燈嗡嗡閃爍，且逐站變暗（世界在失去光）
  {
    const dim = (CFG.seep.lampDim[ST.index] ?? 1) * (ST.blink > 0 ? 0.04 : 1);
    const buzz = 0.82 + 0.18 * Math.abs(Math.sin(R.elapsed * 23.7) * Math.sin(R.elapsed * 5.1));
    lamp.intensity = CFG.lamp.intensity * buzz * dim;
    lampFixture.userData.tube.material.color.setScalar(0.75 * buzz * dim);
  }

  // ── 撬鎖面板承載威脅（Iron Lung 路線）──────────────
  if (!R.over) {
    const D = CFG.dread, i = ST.index;
    const amp = D.trackShake[i], hz = D.shakeHz[i], tint = D.tint[i];
    const t = performance.now() / 1000;
    const dx = amp ? Math.sin(t * hz * 6.283) * amp : 0;
    const dy = amp ? Math.cos(t * hz * 5.1) * amp * 0.6 : 0;

    if (CFG.ui.style === 'cutaway') {
      $pins.style.transform = amp ? `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px)` : '';
      drawCutaway(tint);                       // 每幀重畫，顫動與滲色即時反映
    } else {
      tracks.forEach((tr, k) => {
        const ox = amp ? Math.sin(t * hz * 6.283 + k * 1.7) * amp : 0;
        const oy = amp ? Math.cos(t * hz * 5.1 + k * 2.3) * amp * 0.6 : 0;
        tr.style.transform = amp ? `translate(${ox.toFixed(2)}px,${oy.toFixed(2)}px)` : '';
        tr.style.background = tint
          ? `linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(140,30,26,${tint}) 100%)`
          : '';
      });
    }

    // 鎖芯自己回退半格
    if (i >= D.kickbackAt) {
      R.nextKick -= dt;
      if (R.nextKick <= 0) {
        R.nextKick = D.kickbackSec;
        const setPins = R.lock.pins.map((s, k) => s === 'set' ? k : -1).filter(k => k >= 0);
        if (setPins.length) {
          R.lock.release(setPins[setPins.length - 1]);
          beep('release'); renderPins();
        }
      }
    }
    // 未固定的針無故落下
    if (i >= D.dropAt) {
      R.nextDrop -= dt;
      if (R.nextDrop <= 0) {
        R.nextDrop = D.dropSec;
        const partial = R.lock.pins.map((s, k) => s === 'partial' ? k : -1).filter(k => k >= 0);
        if (partial.length) {
          R.lock.release(partial[(Math.random() * partial.length) | 0]);
          renderPins();
        }
      }
    }
  }

  // 死亡條件：
  //  · 臉已經出現 → 給 faceGraceSec 的極限窗口，那一秒還能解鎖活下來
  //  · 潛伏中但玩家一直不回頭 → 超時後強制兌現貼臉，再走同一條窗口
  if (!R.over) {
    const S2 = CFG.stations;
    const overtime = R.elapsed > CFG.round.limit + CFG.round.grabMs / 1000;
    if (ST.phase === 'face') {
      if (ST.faceT > S2.faceGraceSec) {
        ST.z = ST.targetZ = S2.faceZ;
        die();
      }
    } else if (overtime) {
      ST.phase = 'face'; ST.faceT = 0; ST.faceMode = 0;   // 沒回頭的人也要見到牠
      ST.index = S2.z.length - 1;
      ST.z = ST.targetZ = S2.faceZ;
      monster.visible = true;
      beep('face');
    }
  }

  // 手電筒：near/far 隨轉頭角度過渡（曝光適應），加上閃爍
  {
    const runF = intro.active && intro.phase === 'run' ? Math.min(1, intro.z / 2.5) : 0;
    const turnF = Math.max(runF, Math.min(1, Math.abs(look.yaw) / 110));
    const farDim = (intro.active ? 1 : (CFG.seep.farDim[ST.index] ?? 1)) * (ST.blink > 0 ? 0.10 : 1);
    const L = CFG.light, lerp = (a, b) => a + (b - a) * turnF;
    const flick = 1 - L.flicker * (Math.sin(performance.now() / 46) * .5 + .5);
    flash3d.intensity = lerp(L.near.intensity, L.far.intensity * farDim) * flick;
    flash3d.decay     = lerp(L.near.decay, L.far.decay);
    flash3d.angle     = lerp(L.near.angle, L.far.angle);
  }

  updateHands(dt);

  renderer.render(scene, camera);

  if (devOn) {
    $dev.textContent =
      `elapsed ${R.elapsed.toFixed(1)} / ${CFG.round.limit}   dist ${dist.toFixed(1)}m\n` +
      `look ${(R.lookTime/1000).toFixed(1)}s   jam ${(R.jamTime/1000).toFixed(1)}s   err ${R.errorCount}\n` +
      `attempts ${R.attempts.length}   won ${R.attempts.filter(a=>a.won).length}`;
  }
  requestAnimationFrame(tick);
}

newRound();
resize();
tick();
</script>
</body>
</html>
